ACT.pchild = function (el) { S.parentChild = el.dataset.p; UI.render(); };
ACT.ptab = function (el) { S.parentTab = el.dataset.t; UI.render(); window.scrollTo(0, 0); };
var PT = {}, PM = {};

/* ---- Aperçu ---- */
PT.overview = function (pid, P, PR) {
  var st = UI.profStats(pid), wk = weeklyData(pid), thisWeek = wk[wk.length - 1];
  var last7 = P.log.filter(function (e) { return e.t > Date.now() - 7 * 86400000; });
  var acc7 = last7.length ? Math.round(100 * last7.reduce(function (s, e) { return s + e.w; }, 0) / last7.length) : null;
  var cards = '<div class="statgrid"><div class="stat"><span class="sn">' + st.done + '<small> / ' + st.total + '</small></span><span class="sl">leçons terminées</span></div><div class="stat"><span class="sn">' + last7.length + '</span><span class="sl">réponses ces 7 derniers jours</span></div><div class="stat"><span class="sn">' + (acc7 === null ? '–' : acc7 + ' %') + '</span><span class="sl">réussite sur 7 jours</span></div><div class="stat"><span class="sn small">' + (st.last ? UI.fmtDate(st.last) : '–') + '</span><span class="sl">dernière activité</span></div></div>';
  var sess = groupSessions(pid);
  var recent = sess.length ? '<ul class="reslist">' + sess.map(function (d) { var a = Math.round(100 * d.w / d.n); return '<li class="' + LM.band(a).k + '"><div><strong>' + UI.fmtDay(d.t) + '</strong><span class="muted">' + Object.keys(d.lessons).slice(0, 3).map(function (id) { return esc(LM.LESSONS[id].title); }).join(' · ') + '</span></div><div class="rpct"><strong>' + d.n + '</strong><span>réponse' + (d.n > 1 ? 's' : '') + ' · ' + a + ' %</span></div></li>'; }).join('') + '</ul>' : '<p class="muted">Aucune activité pour le moment.</p>';
  var res = P.results.slice(-6).reverse(), results = res.length ? '<ul class="reslist">' + res.map(function (r) { var b = LM.band(r.pct); return '<li class="' + b.k + '"><div><strong>' + esc(r.label) + '</strong><span class="muted">' + UI.fmtDate(r.t) + '</span></div><div class="rpct"><strong>' + r.pct + ' %</strong><span>' + b.label + '</span></div></li>'; }).join('') + '</ul>' : '<p class="muted">Pas encore de quiz ni d’évaluation.</p>';
  var weak = Object.keys(LM.SKILLS).filter(function (s) { return LM.SKILLS[s].profile === pid && LM.skillStats(pid, s).status === 'review'; });
  var weakH = weak.length ? '<ul class="recs">' + weak.map(function (s) { var l = LM.LESSONS[LM.SKILLS[s].lessons[0]], stt = LM.skillStats(pid, s); return '<li><div><strong>' + esc(LM.SKILLS[s].label) + '</strong><span class="muted"> · ' + esc(l.title) + ' · ' + Math.round(stt.acc * 100) + ' %</span></div><div class="row"><button class="btn sm" data-a="passign" data-id="' + l.id + '" data-note="À revoir : ' + esc(LM.SKILLS[s].label) + '">' + icon('plus') + 'Assigner la leçon</button></div></li>'; }).join('') + '</ul>' : '<p class="muted">Aucune compétence en difficulté repérée pour l’instant (il faut quelques réponses pour que ce soit fiable).</p>';
  var nxt = LM.queue(pid).filter(function (i) { return i.kind === 'next'; }).slice(0, 4);
  var next = nxt.length ? '<ul class="plain">' + nxt.map(function (i) { return '<li><strong>' + esc(i.lesson.title) + '</strong> <span class="muted">(' + esc(LM.SUBJECTS[i.lesson.subject].short) + ', ' + i.lesson.min + ' min)</span> <button class="btn sm" data-a="passign" data-id="' + i.lesson.id + '">Assigner</button></li>'; }).join('') + '</ul>' : '<p class="muted">Toutes les leçons disponibles sont terminées.</p>';
  var tbl = '<details class="tbl"><summary>Voir les chiffres du graphique</summary>' + LM.table(['Semaine du', 'Réponses', 'Réussite'], wk.map(function (d) { return [d.start.getDate() + '/' + (d.start.getMonth() + 1), d.n, d.acc === null ? '–' : d.acc + ' %']; })) + '</details>';
  return cards + '<div class="grid2"><section class="card"><h2 class="h2">Progression dans le temps</h2>' + chartSVG(wk) + tbl + '</section><section class="card"><h2 class="h2">À revoir</h2>' + weakH + '</section></div>' +
    '<div class="grid2"><section class="card"><h2 class="h2">Activité récente</h2>' + recent + '</section><section class="card"><h2 class="h2">Évaluations et quiz</h2>' + results + '</section></div>' +
    '<section class="card"><h2 class="h2">Prochaines leçons suggérées</h2>' + next + '</section>';
};
ACT.passign = function (el) {
  var pid = S.parentChild, P = LM.P(pid), id = el.dataset.id;
  if (!P.assigned.some(function (a) { return a.lesson === id && !a.done; })) P.assigned.push({ lesson: id, note: el.dataset.note || '', ts: Date.now(), done: false });
  UI.save(); UI.toast('Leçon assignée à ' + LM.PROFILES[pid].name + ' : elle apparaît dans sa séance du jour.');
  if (S.parentTab === 'assign') UI.render();
};

/* ---- Semaine ---- */
PT.week = function (pid, P, PR) {
  var plan = LM.week(pid), set = P.settings;
  var days = [1, 2, 3, 4, 5, 6, 7].map(function (d) { return '<label class="check daychk"><input type="checkbox" data-c="pday" data-d="' + d + '"' + (set.days.indexOf(d) >= 0 ? ' checked' : '') + '> ' + LM.DAYS[d] + '</label>'; }).join('');
  var ctl = '<section class="card"><h2 class="h2">Rythme de ' + PR.name + '</h2><p class="muted">Séances courtes conseillées : ' + (pid === 'milad' ? '10 à 15 minutes' : '15 à 25 minutes') + '. Pas de pression : un jour manqué ne change rien, le plan se recalcule.</p><div class="slidegrid"><label for="pmin">Durée d’une séance</label><div class="inl"><input id="pmin" type="number" min="5" max="60" step="5" value="' + set.minutes + '" data-c="pmin" class="num"> <span>minutes</span></div></div><fieldset class="days"><legend>Jours de travail</legend>' + days + '</fieldset></section>';
  var cols = plan.length ? '<div class="weekgrid">' + plan.map(function (d) {
    return '<article class="wday' + (d.done ? ' done' : '') + '"><h3 class="h3">' + LM.DAYS[d.dow] + ' <small>' + d.date.getDate() + '/' + (d.date.getMonth() + 1) + '</small></h3>' + (d.done ? '<p class="okline">' + icon('check') + ' Du travail a été fait ce jour-là</p>' : '') + (d.items.length ? '<ul class="plain">' + d.items.map(function (i) { return '<li><span class="muted">' + esc(i.label) + '</span><br><strong>' + esc(i.kind === 'review' ? LM.skillLabel(i.skill) : i.lesson.title) + '</strong> <span class="muted">· ' + i.min + ' min</span></li>'; }).join('') + '</ul><p class="muted small">Total environ ' + d.total + ' min</p>' : '<p class="muted">Rien de prévu.</p>') + '</article>';
  }).join('') + '</div>' : '<p>Choisis au moins un jour.</p>';
  return ctl + '<section class="card"><h2 class="h2">Plan de la semaine</h2><p class="muted">Calculé à partir des leçons assignées, des compétences à revoir, puis de la suite du programme. Il change quand vous assignez ou terminez une leçon.</p>' + cols + '</section>';
};
CHG.pmin = function (el) { var P = LM.P(S.parentChild), v = Math.max(5, Math.min(60, parseInt(el.value, 10) || 15)); P.settings.minutes = v; UI.save(); UI.render(); };
CHG.pday = function (el) {
  var P = LM.P(S.parentChild), d = +el.dataset.d, i = P.settings.days.indexOf(d);
  if (el.checked && i < 0) P.settings.days.push(d); if (!el.checked && i >= 0) P.settings.days.splice(i, 1);
  UI.save(); UI.render();
};

/* ---- Assigner ---- */
PT.assign = function (pid, P, PR) {
  var opts = LM.ORDER[pid].map(function (s) { var ls = LM.lessonsOf(pid, s); return ls.length ? '<optgroup label="' + esc(LM.SUBJECTS[s].name) + '">' + ls.map(function (l) { return '<option value="' + l.id + '">' + esc(l.title) + '</option>'; }).join('') + '</optgroup>' : ''; }).join('');
  var form = '<section class="card"><h2 class="h2">Assigner une leçon à ' + PR.name + '</h2><div class="formgrid"><label for="asel">Leçon</label><select id="asel">' + opts + '</select><label for="anote">Message (facultatif)</label><input id="anote" type="text" maxlength="80" placeholder="par ex. Évaluation vendredi"></div><div class="row"><button class="btn primary" data-a="passignform">' + icon('plus') + 'Assigner</button></div></section>';
  var list = P.assigned.length ? '<ul class="recs">' + P.assigned.slice().reverse().map(function (a, ri) { var l = LM.LESSONS[a.lesson]; if (!l) return ''; var idx = P.assigned.length - 1 - ri; return '<li><div><strong>' + esc(l.title) + '</strong><span class="muted"> · ' + UI.fmtDate(a.ts) + (a.note ? ' · « ' + esc(a.note) + ' »' : '') + '</span><br>' + (a.done ? UI.chip('st-solid', 'Fait') : UI.chip('st-progress', 'À faire')) + '</div><div class="row">' + (a.done ? '' : '<button class="btn sm" data-a="adone" data-i="' + idx + '">Marquer fait</button>') + '<button class="btn sm" data-a="adel" data-i="' + idx + '" aria-label="Retirer ' + esc(l.title) + '">' + icon('trash') + 'Retirer</button></div></li>'; }).join('') + '</ul>' : '<p class="muted">Aucune leçon assignée.</p>';
  var done = LM.allLessons(pid).filter(function (l) { return P.done[l.id]; });
  var redo = done.length ? '<section class="card"><h2 class="h2">Revisiter une leçon difficile</h2><p class="muted">« Refaire » remet la leçon à « à faire » et l’ajoute à la séance de ' + PR.name + '. Les anciens résultats restent dans l’historique.</p><ul class="recs">' + done.map(function (l) { var weak = Object.keys(l.skills).some(function (s) { return LM.skillStats(pid, s).status === 'review'; }); return '<li><div><strong>' + esc(l.title) + '</strong>' + (weak ? ' ' + UI.chip('st-review', 'À revoir') : '') + '</div><button class="btn sm" data-a="aredo" data-id="' + l.id + '">' + icon('refresh') + 'Refaire</button></li>'; }).join('') + '</ul></section>' : '';
  return form + '<section class="card"><h2 class="h2">Leçons assignées</h2>' + list + '</section>' + redo;
};
ACT.passignform = function () { var sel = document.getElementById('asel'), note = document.getElementById('anote'); ACT.passign({ dataset: { id: sel.value, note: note.value.trim() } }); UI.render(); };
ACT.adone = function (el) { var P = LM.P(S.parentChild); P.assigned[+el.dataset.i].done = true; UI.save(); UI.render(); };
ACT.adel = function (el) { var P = LM.P(S.parentChild); P.assigned.splice(+el.dataset.i, 1); UI.save(); UI.render(); };
ACT.aredo = function (el) { var P = LM.P(S.parentChild), id = el.dataset.id; delete P.done[id]; if (!P.assigned.some(function (a) { return a.lesson === id && !a.done; })) P.assigned.push({ lesson: id, note: 'À refaire', ts: Date.now(), done: false }); UI.save(); UI.render(); UI.toast('Leçon remise à faire.'); };

/* ---- Compétences ---- */
PT.skills = function (pid, P, PR) {
  var out = LM.ORDER[pid].map(function (s) {
    var ids = Object.keys(LM.SKILLS).filter(function (k) { return LM.SKILLS[k].profile === pid && LM.SKILLS[k].subject === s; });
    if (!ids.length) return '';
    var rows = ids.map(function (k) { var st = LM.skillStats(pid, k), S3 = LM.STATUS[st.status], S2 = LM.SKILLS[k]; return '<tr><th scope="row">' + esc(S2.label) + '</th><td><span class="chip st-' + S3.cls + '">' + S3.label + '</span></td><td>' + (st.n ? Math.round(st.acc * 100) + ' %' : '–') + '</td><td>' + st.n + '</td><td><button class="btn sm" data-a="passign" data-id="' + S2.lessons[0] + '" data-note="Revoir : ' + esc(S2.label) + '">Assigner</button></td></tr>'; }).join('');
    return '<section class="card" style="--sc:' + UI.subjectColor(s) + '"><h2 class="h2">' + esc(LM.SUBJECTS[s].name) + '</h2><div class="tablewrap"><table class="data"><thead><tr><th scope="col">Compétence</th><th scope="col">État</th><th scope="col">Réussite (12 dernières)</th><th scope="col">Réponses</th><th scope="col"><span class="sr">Action</span></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }).join('');
  return '<p class="muted">Les états se basent sur les réponses réelles (pas sur les leçons lues). Il faut au moins 3 réponses pour afficher « En progrès » ou « À revoir », et 5 pour « Solide ».</p>' + out;
};

/* ---- Cours de l'école ---- */
PT.import = function (pid, P, PR) {
  var topics = LM.ORDER[pid].map(function (s) { var ls = LM.lessonsOf(pid, s); return ls.length ? '<details class="topicgrp"><summary>' + esc(LM.SUBJECTS[s].name) + '</summary>' + ls.map(function (l) { return '<label class="check"><input type="checkbox" class="tpick" value="' + l.id + '"> ' + esc(l.title) + '</label>'; }).join('') + '</details>' : ''; }).join('');
  var saved = P.docs.length ? '<section class="card"><h2 class="h3">Rapprochements enregistrés</h2><ul class="plain">' + P.docs.slice().reverse().map(function (d) { return '<li><strong>' + esc(d.title || 'Sans titre') + '</strong> <span class="muted">' + UI.fmtDate(d.t) + ' — ' + d.lessons.map(function (id) { return LM.LESSONS[id] ? esc(LM.LESSONS[id].title) : ''; }).filter(Boolean).join(', ') + '</span></li>'; }).join('') + '</ul></section>' : '';
  return '<section class="card"><h2 class="h2">Relier un cours ou une évaluation de l’école à des exercices</h2>' +
    '<div class="notice info"><strong>Comment ça marche, et ses limites.</strong><ul class="plain"><li>L’analyse se fait <strong>uniquement dans ce navigateur</strong> : rien n’est envoyé, et le texte n’est <strong>pas enregistré</strong> (seulement un titre et la liste des leçons choisies si vous le demandez).</li><li>Le site compare les <strong>mots-clés</strong> du texte avec ceux des leçons. Ce n’est pas une lecture intelligente : une notion mal nommée peut être ratée. Vérifiez toujours les propositions.</li><li>Les <strong>photos et PDF scannés ne sont pas lus</strong> (pas de reconnaissance de texte). Tapez les titres de la leçon ou cochez les thèmes ci-dessous.</li></ul></div>' +
    '<div class="formgrid"><label for="dtitle">Titre (facultatif)</label><input id="dtitle" type="text" maxlength="80" placeholder="par ex. Évaluation de maths, division"><label for="dtext">Texte de la leçon ou de l’évaluation</label><textarea id="dtext" rows="6" placeholder="Collez ou écrivez ici les titres, notions, consignes… par ex. « La division euclidienne : quotient et reste »"></textarea><label for="dfile">Ou choisir un fichier texte (.txt, .md, .csv)</label><input id="dfile" type="file" accept=".txt,.md,.csv,.html,text/plain" data-c="dfile"></div>' +
    '<h3 class="h3">Ou cochez les thèmes traités en classe</h3>' + topics + '<div class="row"><button class="btn primary" data-a="dmap">' + icon('book') + 'Trouver les leçons liées</button></div><div id="dres" aria-live="polite"></div></section>' + saved;
};
CHG.dfile = function (el) {
  var f = el.files && el.files[0], out = document.getElementById('dres'); if (!f) return;
  if (!/\.(txt|md|csv|html?)$/i.test(f.name) && !/^text\//.test(f.type)) { out.innerHTML = '<div class="notice stop">Ce type de fichier (photo, PDF…) ne peut pas être lu ici. Tapez les titres du cours ou cochez les thèmes.</div>'; el.value = ''; return; }
  var rd = new FileReader();
  rd.onload = function () { var t = String(rd.result || ''); if (/\.html?$/i.test(f.name)) t = t.replace(/<[^>]+>/g, ' '); document.getElementById('dtext').value = t.slice(0, 20000); UI.toast('Fichier lu dans le navigateur (non envoyé, non enregistré).'); };
  rd.onerror = function () { out.innerHTML = '<div class="notice stop">Impossible de lire ce fichier.</div>'; };
  rd.readAsText(f);
};
ACT.dmap = function () {
  var pid = S.parentChild, txt = document.getElementById('dtext').value, picked = Array.prototype.map.call(document.querySelectorAll('.tpick:checked'), function (c) { return c.value; });
  var out = document.getElementById('dres');
  if (!txt.trim() && !picked.length) { out.innerHTML = '<div class="notice stop">Écrivez un texte ou cochez au moins un thème.</div>'; return; }
  var m = LM.mapText(pid, txt, picked);
  UI._dm = m;
  if (!m.length) { out.innerHTML = '<div class="notice">Aucune leçon ne correspond clairement. Essayez d’ajouter des mots-clés (par ex. « fractions », « imparfait », « soustraction ») ou cochez des thèmes.</div>'; return; }
  out.innerHTML = '<h3 class="h3">Leçons proposées</h3><ul class="recs">' + m.map(function (x) { return '<li><div><strong>' + esc(x.lesson.title) + '</strong> <span class="muted">· ' + esc(LM.SUBJECTS[x.lesson.subject].short) + '</span><br><span class="muted small">Mots repérés : ' + x.hits.map(esc).join(', ') + '</span></div><div class="row"><button class="btn sm" data-a="passign" data-id="' + x.lesson.id + '" data-note="' + esc((document.getElementById('dtitle').value || 'Cours de l’école').slice(0, 60)) + '">' + icon('plus') + 'Assigner</button><button class="btn sm" data-a="openLessonP" data-id="' + x.lesson.id + '">Ouvrir</button></div></li>'; }).join('') + '</ul><div class="row"><button class="btn primary" data-a="dpractice">' + icon('play') + 'Lancer un entraînement sur ces thèmes</button><button class="btn" data-a="dsave">Enregistrer ce rapprochement (titre + leçons, sans le texte)</button></div>';
};
ACT.openLessonP = function (el) { var l = LM.LESSONS[el.dataset.id]; S.parentOrigin = true; UI.go('lesson', { profile: l.profile, id: l.id }); };
ACT.dpractice = function () {
  var pid = S.parentChild, sk = {}; (UI._dm || []).slice(0, 4).forEach(function (x) { Object.keys(x.lesson.skills).forEach(function (s) { sk[s] = 1; }); });
  UI.startRun(pid, LM.buildSession({ kind: 'skills', skills: Object.keys(sk), profile: pid }));
};
ACT.dsave = function () {
  var pid = S.parentChild, P = LM.P(pid), t = document.getElementById('dtitle').value.trim();
  P.docs.push({ t: Date.now(), title: t || 'Sans titre', lessons: (UI._dm || []).map(function (x) { return x.lesson.id; }) }); UI.save(); UI.toast('Rapprochement enregistré (sans le texte du document).'); UI.render();
};

/* ---- Fiches à imprimer ---- */
PT.print = function (pid, P, PR) {
  var chOpts = LM.ORDER[pid].map(function (s) { var cs = LM.chaptersOf(pid, s); return cs.length ? '<optgroup label="' + esc(LM.SUBJECTS[s].name) + '">' + cs.map(function (c) { return '<option value="c:' + c.id + '">Chapitre : ' + esc(c.title) + '</option>' + c.lessonIds.map(function (id) { return '<option value="l:' + id + '">&nbsp;&nbsp;Leçon : ' + esc(LM.LESSONS[id].title) + '</option>'; }).join(''); }).join('') + '</optgroup>' : ''; }).join('');
  return '<section class="card"><h2 class="h2">Préparer une fiche pour ' + PR.name + '</h2><div class="formgrid"><label for="pkind">Type</label><select id="pkind"><option value="ex">Feuille d’exercices (avec corrigé séparé)</option><option value="rev">Fiche de révision (À retenir)</option></select><label for="pscope">Sujet</label><select id="pscope">' + chOpts + '</select><label for="plvl">Niveau</label><select id="plvl"><option value="0">Mélange progressif</option><option value="1">Facile</option><option value="2">Moyen</option><option value="3">Défi</option></select><label for="pn">Nombre de questions</label><select id="pn"><option>6</option><option selected>10</option><option>15</option></select></div><div class="row"><button class="btn primary" data-a="pmake">' + icon('print') + 'Préparer la fiche</button></div><p class="muted small">Les feuilles d’exercices sont générées avec des nombres différents à chaque fois. Le corrigé correspond exactement à la feuille préparée.</p></section>';
};
ACT.pmake = function () {
  var pid = S.parentChild, kind = document.getElementById('pkind').value, scope = document.getElementById('pscope').value, lvl = +document.getElementById('plvl').value, n = +document.getElementById('pn').value;
  var ls = scope.indexOf('c:') === 0 ? LM.chapterById(scope.slice(2)).lessonIds.map(function (id) { return LM.LESSONS[id]; }) : [LM.LESSONS[scope.slice(2)]];
  var title = scope.indexOf('c:') === 0 ? LM.chapterById(scope.slice(2)).title : ls[0].title;
  var qs = [];
  if (kind === 'ex') {
    var entries = []; ls.forEach(function (l) { entries = entries.concat(LM.entriesOfLesson(l)); });
    var plan = []; for (var i = 0; i < n; i++) plan.push(lvl || (i < n * 0.4 ? 1 : (i < n * 0.8 ? 2 : 3)));
    qs = LM.draw(entries, plan, LM.seed());
  }
  S.print = { pid: pid, kind: kind, title: title, lessons: ls, qs: qs, date: Date.now(), mode: 'both' };
  UI.go('print', { profile: pid });
};

/* ---- Guides ---- */
PT.guides = function (pid) {
  return '<p class="muted">Un guide par leçon : comment expliquer, quelles questions poser, quelles erreurs surveiller. Il est aussi visible dans chaque leçon (« Guide pour l’adulte »).</p>' + LM.ORDER[pid].map(function (s) {
    var ls = LM.lessonsOf(pid, s).filter(function (l) { return l.parent; });
    return ls.length ? '<section class="card" style="--sc:' + UI.subjectColor(s) + '"><h2 class="h2">' + esc(LM.SUBJECTS[s].name) + '</h2>' + ls.map(function (l) { return '<details class="parentguide"><summary>' + esc(l.title) + '</summary><div class="pgbody"><p class="muted"><em>Objectif de l’enfant : ' + l.ob + '</em></p>' + (l.parent.how ? '<h4>Comment l’expliquer</h4>' + (Array.isArray(l.parent.how) ? '<ul class="plain">' + l.parent.how.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' : '<p>' + l.parent.how + '</p>') : '') + (l.parent.ask ? '<h4>Questions à poser</h4><ul class="plain">' + l.parent.ask.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' : '') + (l.parent.watch ? '<h4>Erreurs à surveiller</h4><ul class="plain">' + l.parent.watch.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' : '') + '<button class="btn sm" data-a="openLessonP" data-id="' + l.id + '">Ouvrir la leçon</button></div></details>'; }).join('') + '</section>' : '';
  }).join('');
};

/* ---- Programme ---- */
PT.program = function (pid) {
  var C = LM.CUR[pid];
  var src = C.sources.map(function (s) { return '<li><a href="' + s.url + '" target="_blank" rel="noopener noreferrer">' + esc(s.t) + '</a>' + (s.n ? ' <span class="muted">— ' + esc(s.n) + '</span>' : '') + (s.ok === false ? ' <span class="chip st-review">à vérifier</span>' : '') + '</li>'; }).join('');
  var statL = { done: ['st-solid', 'Leçons prêtes'], part: ['st-progress', 'En partie'], planned: ['plan', 'À venir'] };
  var tot = { done: 0, all: 0 };
  var subs = C.subjects.map(function (s) {
    var tr = s.chapters.map(function (ch) {
      var avail = ch.lessons.filter(function (l) { return LM.LESSONS[l.id]; }), missing = ch.lessons.filter(function (l) { return !LM.LESSONS[l.id]; });
      tot.done += avail.length; tot.all += ch.lessons.length;
      var status = !avail.length ? 'planned' : (!missing.length ? 'done' : 'part');
      return '<tr><td><strong>' + esc(ch.title) + '</strong><br><span class="muted small">' + ch.topics.map(esc).join(' ; ') + '</span></td><td>' + UI.chip(statL[status][0], statL[status][1]) + '<br><span class="small muted">' + avail.length + ' / ' + ch.lessons.length + '</span></td><td>' + avail.map(function (l) { return '<a href="#" class="lk" data-a="openLessonP" data-id="' + l.id + '">' + esc(LM.LESSONS[l.id].title) + '</a>'; }).join('<br>') + (missing.length ? '<span class="muted small">À venir : ' + missing.map(function (l) { return esc(l.title); }).join(' · ') + '</span>' : '') + '</td></tr>';
    }).join('');
    var srcs = (s.src || []).map(function (x) { return '<a href="' + x.url + '" target="_blank" rel="noopener noreferrer">' + esc(x.t) + '</a>'; }).join('<br>');
    return '<section class="card"><h2 class="h2">' + esc(LM.SUBJECTS[s.id].name) + '</h2><p class="muted">' + s.ref + '</p><div class="tablewrap"><table class="data"><thead><tr><th scope="col">Chapitre et contenus du programme</th><th scope="col">Dans le site</th><th scope="col">Leçons</th></tr></thead><tbody>' + tr + '</tbody></table></div><details class="tbl"><summary>Sources officielles</summary><p class="small">' + srcs + '</p></details></section>';
  }).join('');
  var notes = C.notes.map(function (n) { return '<li>' + n + '</li>'; }).join('');
  return '<section class="card"><h2 class="h2">Programme 2026-2027 : ' + LM.PROFILES[pid].cls + '</h2><p><strong>' + tot.done + ' leçons prêtes sur ' + tot.all + ' prévues.</strong> Une leçon « à venir » n’existe pas encore : elle n’est jamais comptée comme faite.</p><div class="notice info"><strong>Ce qui a été vérifié (octobre 2026)</strong><ul class="plain">' + notes + '</ul></div><h3 class="h3">Sources officielles</h3><ul class="plain">' + src + '</ul></section>' + subs;
};

/* ---- Données ---- */
PT.data = function (pid, P, PR) {
  var persist = LM.store.persistent, inFrame = UI.inFrame;
  return '<section class="card"><h2 class="h2">Où sont enregistrés les progrès ?</h2><p>Dans la mémoire de <strong>ce navigateur, sur cet appareil</strong> (stockage local). Rien n’est envoyé sur internet, il n’y a ni compte ni publicité.</p><ul class="plain"><li>Les progrès <strong>ne passent pas</strong> d’un appareil ou d’un navigateur à l’autre.</li><li>Ils peuvent être <strong>perdus</strong> si vous videz les données du navigateur, utilisez la navigation privée ou changez d’appareil.</li><li>Faites régulièrement une <strong>sauvegarde</strong> avec « Exporter ».</li></ul>' + (persist ? '<p class="okline">' + icon('check') + ' L’enregistrement automatique fonctionne dans ce navigateur.</p>' : '<div class="notice stop">L’enregistrement automatique est bloqué dans ce navigateur. Utilisez « Exporter ».</div>') + '</section>' +
    '<section class="card"><h2 class="h2">Exporter une sauvegarde</h2><div class="row"><button class="btn" data-a="dexport" data-w="' + pid + '">' + LM.PROFILES[pid].name + ' seulement</button><button class="btn" data-a="dexport" data-w="all">Les deux enfants</button></div><div id="exbox" hidden><label for="extext">Texte de sauvegarde (copiez-le et gardez-le dans un fichier)</label><textarea id="extext" rows="5" readonly></textarea><div class="row"><button class="btn primary" data-a="dcopy">' + icon('copy') + 'Copier</button>' + (inFrame ? '' : '<button class="btn" data-a="ddl">' + icon('save') + 'Télécharger le fichier</button>') + '</div>' + (inFrame ? '<p class="muted small">Le téléchargement direct n’est pas disponible dans cet aperçu intégré : copiez le texte dans un fichier. Dans la version fichier du site, un bouton de téléchargement apparaît.</p>' : '') + '</div></section>' +
    '<section class="card"><h2 class="h2">Importer une sauvegarde</h2><div class="formgrid"><label for="imtext">Collez le texte de la sauvegarde</label><textarea id="imtext" rows="4" placeholder="{&quot;app&quot;:&quot;cartable-maison&quot;, …}"></textarea><label for="imfile">Ou choisissez le fichier</label><input id="imfile" type="file" accept=".json,application/json,text/plain" data-c="imfile"></div><div class="row"><button class="btn primary" data-a="dimport">Vérifier la sauvegarde</button></div><div id="imres" aria-live="polite"></div></section>' +
    '<section class="card"><h2 class="h2">Remettre à zéro</h2><p>Efface les leçons terminées, les résultats, les réponses enregistrées, les assignations et les badges. <strong>Cette action est définitive</strong> (pensez à exporter avant).</p><div class="formgrid"><label for="rtype">Pour confirmer, écrivez le prénom (<strong>' + PR.name + '</strong>) ou le mot <strong>TOUT</strong> :</label><input id="rtype" type="text" autocomplete="off"></div><div class="row"><button class="btn danger" data-a="dreset" data-p="' + pid + '">Remettre ' + PR.name + ' à zéro</button><button class="btn danger" data-a="dreset" data-p="all">Tout effacer (les deux enfants)</button></div><div id="rres" aria-live="polite"></div></section>';
};
ACT.dexport = function (el) {
  var w = el.dataset.w, txt = w === 'all' ? LM.store.exportAll() : LM.store.exportOne(w), box = document.getElementById('exbox');
  box.hidden = false; document.getElementById('extext').value = txt; document.getElementById('extext').select(); UI._export = { txt: txt, w: w };
};
ACT.dcopy = function () {
  var t = document.getElementById('extext'); t.select();
  var ok = function () { UI.toast('Sauvegarde copiée.'); };
  try { navigator.clipboard.writeText(t.value).then(ok, function () { try { document.execCommand('copy'); ok(); } catch (e) { UI.toast('Sélectionnez le texte et copiez-le (Ctrl+C).'); } }); } catch (e) { try { document.execCommand('copy'); ok(); } catch (e2) { UI.toast('Sélectionnez le texte et copiez-le (Ctrl+C).'); } }
};
ACT.ddl = function () {
  var e = UI._export; if (!e) return;
  try { var b = new Blob([e.txt], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'cartable-maison-' + e.w + '-' + LM.dayKey(Date.now()) + '.json'; document.body.appendChild(a); a.click(); a.remove(); }
  catch (er) { UI.toast('Téléchargement impossible : copiez le texte.'); }
};
CHG.imfile = function (el) {
  var f = el.files && el.files[0]; if (!f) return; var rd = new FileReader();
  rd.onload = function () { document.getElementById('imtext').value = String(rd.result || ''); };
  rd.readAsText(f);
};
ACT.dimport = function () {
  var v = LM.store.validate(document.getElementById('imtext').value), out = document.getElementById('imres');
  if (!v.ok) { out.innerHTML = '<div class="notice stop">' + esc(v.err) + '</div>'; return; }
  UI._imp = v;
  out.innerHTML = '<div class="notice"><p><strong>Sauvegarde valide.</strong> Elle contient : ' + v.ids.map(function (id) { var p = v.json.data.profiles[id]; return LM.PROFILES[id].name + ' (' + Object.keys(p.done).length + ' leçons, ' + p.results.length + ' résultats)'; }).join(' ; ') + '.</p><p><strong>Importer remplacera</strong> les données actuelles de ' + v.ids.map(function (id) { return LM.PROFILES[id].name; }).join(' et ') + '.</p><div class="row"><button class="btn danger" data-a="dimportok">Oui, importer et remplacer</button></div></div>';
};
ACT.dimportok = function () { var v = UI._imp; if (!v) return; LM.store.importData(v.json, v.ids); UI.toast('Sauvegarde importée.'); UI._imp = null; UI.render(); };
ACT.dreset = function (el) {
  var w = el.dataset.p, t = document.getElementById('rtype').value.trim().toLowerCase(), out = document.getElementById('rres');
  var ok = w === 'all' ? t === 'tout' : t === LM.PROFILES[w].name.toLowerCase();
  if (!ok) { out.innerHTML = '<div class="notice stop">Écrivez ' + (w === 'all' ? 'TOUT' : LM.PROFILES[w].name) + ' dans la case pour confirmer.</div>'; return; }
  if (w === 'all') LM.store.resetAll(); else LM.store.reset(w);
  UI.toast('Données remises à zéro.'); UI.render();
};

/* ---- Réglages ---- */
PT.settings = function (pid, P, PR) {
  var s = P.settings;
  return '<section class="card"><h2 class="h2">Réglages pour ' + PR.name + '</h2><div class="formgrid"><label for="smin">Durée d’une séance (minutes)</label><div class="inl"><input id="smin" type="number" min="5" max="60" step="5" value="' + s.minutes + '" data-c="pmin" class="num"> <span class="muted">conseillé : ' + (pid === 'milad' ? '10 à 15' : '15 à 25') + '</span></div>' +
    '<span class="lbl">Taille du texte</span><div class="inl"><button class="btn sm" data-a="pfont" data-d="-0.1" aria-label="Réduire le texte">A−</button><output>' + Math.round(s.fontScale * 100) + ' %</output><button class="btn sm" data-a="pfont" data-d="0.1" aria-label="Agrandir le texte">A+</button></div></div>' +
    '<label class="check"><input type="checkbox" data-c="pbadge"' + (s.badges ? ' checked' : '') + '> Afficher les badges d’encouragement (pas de classement, pas de série à maintenir)</label>' +
    '<label class="check"><input type="checkbox" data-c="ptimer"' + (s.timer ? ' checked' : '') + '> Chronomètre coché par défaut dans les évaluations</label></section>' +
    '<section class="card"><h2 class="h2">Accessibilité</h2><ul class="plain"><li>Tout se fait au clavier (Tab, Entrée, flèches) et au doigt (boutons d’au moins 44 px).</li><li>Les exercices « glisser-déposer » sont remplacés par des flèches et des menus.</li><li>Le thème clair ou sombre se choisit en bas de page.</li></ul></section>';
};
CHG.pbadge = function (el) { LM.P(S.parentChild).settings.badges = el.checked; UI.save(); };
CHG.ptimer = function (el) { LM.P(S.parentChild).settings.timer = el.checked; UI.save(); };
ACT.pfont = function (el) { var s = LM.P(S.parentChild).settings; s.fontScale = Math.max(0.8, Math.min(1.5, Math.round((s.fontScale + (+el.dataset.d)) * 10) / 10)); UI.save(); UI.render(); };

/* ================== vue d'impression ================== */
function pq(Q, n) {
  var h = '<li class="pq"><div class="pqq">' + Q.q.replace(/<div>.*?<\/div>/gs, function (m) { return m; }) + '</div>';
  if (Q.fig && Q.type !== 'numline') h += LM.fig(Q.fig);
  var t = Q.type;
  if (t === 'mcq') h += '<ul class="popts">' + Q.opts.map(function (o) { return '<li><span class="box"></span>' + o + '</li>'; }).join('') + '</ul>';
  else if (t === 'fill') {
    var out = '<div class="pfill">';
    for (var i = 0; i < Q.blanks.length; i++) { out += Q.parts[i] + (Q.blanks[i].opts ? '<span class="pchoice">(' + Q.blanks[i].opts.map(esc).join(' / ') + ')</span>' : '<span class="pblank"></span>'); }
    h = h.replace(/<div class="pqq">.*?<\/div>/s, '<div class="pqq">' + out + Q.parts[Q.blanks.length] + '</div></div>');
  }
  else if (t === 'order') h += '<p class="small">Numérote de 1 à ' + Q.items.length + ' :</p><ul class="popts">' + Q.shuf.map(function (o) { return '<li><span class="box wide"></span>' + esc(o) + '</li>'; }).join('') + '</ul>';
  else if (t === 'match') h += '<table class="pmatch"><tbody>' + Q.pairs.map(function (p, i) { return '<tr><td>' + p[0] + '</td><td class="pdash">………………</td><td>' + esc(Q.rightOrder[i] || '') + '</td></tr>'; }).join('') + '</tbody></table><p class="small">Écris à côté de chaque mot de gauche le mot de droite qui lui correspond.</p>';
  else if (t === 'build') h += '<p class="small">Mots à utiliser : ' + Q.bag.map(function (w) { return '<span class="ptok">' + esc(w) + '</span>'; }).join(' ') + '</p><div class="pline long"></div>';
  else if (t === 'steps') h += '<ol class="psteps">' + Q.steps.map(function (s) { return '<li>' + s.p + ' <span class="pblank"></span></li>'; }).join('') + '</ol>';
  else if (t === 'numline') h += LM.fig(Object.assign({}, Q.fig, { arrow: null })) + '<p class="small">Marque d’une croix la bonne place.</p>';
  else if (t === 'shade') h += LM.fig({ k: 'frac', n: Q.n, on: 0, shape: 'bar' }) + '<p class="small">Colorie les parts demandées.</p>';
  else if (t === 'write') h += '<div class="plines" style="--rows:9"></div>';
  else h += '<div class="pline">Réponse : <span class="pblank long"></span>' + (Q.unit ? ' ' + esc(Q.unit) : '') + '</div>';
  return h + '</li>';
}
function pa(Q, n) {
  var why = Q.why || '';
  return '<li class="pa"><div class="paq">' + Q.q.replace(/<div>.*?<\/div>/gs, '').replace(/<br>/g, ' ') + '</div><div class="paa"><strong>Réponse :</strong> ' + LM.answerHTML(Q) + '</div>' + (why ? '<div class="pae">' + why + '</div>' : '') + '</li>';
}
VIEWS.print = function () {
  var pr = S.print;
  if (!pr) return { html: '<div class="card"><p>Aucune fiche préparée.</p></div>' };
  var PR = LM.PROFILES[pr.pid], head = '<header class="phead"><div><strong class="ptitle">' + esc(pr.title) + '</strong><br><span class="psub">' + (pr.kind === 'ex' ? 'Feuille d’exercices d’entraînement' : 'Fiche de révision') + ' · ' + PR.cls + '</span></div><div class="pname">Prénom : <span class="pblank long"></span><br>Date : <span class="pblank"></span></div></header>';
  var sheet = '', key = '';
  if (pr.kind === 'ex') {
    var last = null; sheet = '<ol class="plist">' + pr.qs.map(function (Q, i) { var ps = ''; if (Q.passage && Q.passage !== last) { ps = '<li class="ppass"><strong>' + esc(Q.passageTitle || 'Texte') + '</strong><div lang="fr">' + Q.passage + '</div></li>'; last = Q.passage; } return ps + pq(Q, i + 1); }).join('') + '</ol>';
    key = '<ol class="plist pkey">' + pr.qs.map(pa).join('') + '</ol>';
  } else {
    sheet = pr.lessons.map(function (l) { return '<section class="pfiche"><h2>' + esc(l.title) + '</h2>' + UI.keepHTML(l) + '</section>'; }).join('');
  }
  var how = UI.inFrame ? '<p>Pour imprimer : appuyez sur <kbd>Ctrl</kbd> + <kbd>P</kbd> (<kbd>⌘</kbd> + <kbd>P</kbd> sur Mac). Si l’aperçu intégré ne permet pas l’impression, ouvrez la version fichier du site (voir la livraison) et imprimez depuis votre navigateur.</p>' : '<div class="row"><button class="btn primary" data-a="doprint">' + icon('print') + 'Imprimer</button></div>';
  var which = pr.kind === 'ex' ? '<fieldset class="pwhich"><legend>À imprimer</legend><label class="check"><input type="radio" name="pw" value="both" data-c="pwhich"' + (pr.mode === 'both' ? ' checked' : '') + '> Feuille et corrigé</label><label class="check"><input type="radio" name="pw" value="sheet" data-c="pwhich"' + (pr.mode === 'sheet' ? ' checked' : '') + '> Feuille seulement</label><label class="check"><input type="radio" name="pw" value="key" data-c="pwhich"' + (pr.mode === 'key' ? ' checked' : '') + '> Corrigé seulement (pour l’adulte)</label></fieldset>' : '';
  var html = '<div class="ptool noprint card"><h1 class="h2">Fiche prête</h1>' + which + how + '<div class="row"><button class="btn" data-a="pmakeagain">' + icon('refresh') + 'Autres questions</button></div></div>' +
    '<div class="psheet pmode-' + pr.mode + '"><section class="paper psheetpage">' + head + sheet + '<footer class="pfoot">Cartable Maison · exercice d’entraînement, pas un examen officiel</footer></section>' +
    (pr.kind === 'ex' ? '<section class="paper pkeypage">' + '<header class="phead"><div><strong class="ptitle">Corrigé · ' + esc(pr.title) + '</strong><br><span class="psub">Pour l’adulte · ' + PR.name + '</span></div></header>' + key + '<footer class="pfoot">Cartable Maison · corrigé</footer></section>' : '') + '</div>';
  return { title: 'Fiche à imprimer', html: html };
};
ACT.doprint = function () { try { window.print(); } catch (e) { UI.toast('Utilisez Ctrl+P pour imprimer.'); } };
CHG.pwhich = function (el) { S.print.mode = el.value; var p = document.querySelector('.psheet'); p.className = 'psheet pmode-' + el.value; };
ACT.pmakeagain = function () {
  var pr = S.print, entries = []; pr.lessons.forEach(function (l) { entries = entries.concat(LM.entriesOfLesson(l)); });
  if (pr.kind !== 'ex') return;
  var n = pr.qs.length, plan = []; for (var i = 0; i < n; i++) plan.push(i < n * 0.4 ? 1 : (i < n * 0.8 ? 2 : 3));
  pr.qs = LM.draw(entries, plan, LM.seed()); UI.render();
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', UI.boot); else UI.boot();

})();</script>
