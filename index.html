<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartable Maison</title>
<meta name="description" content="Cartable Maison : apprendre, s’entraîner et réviser à la maison (CE1 et CM2).">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700&display=swap">
<style>:root{
  --bg:#FBF8F1;--surface:#FFFFFF;--surface2:#F4EFE3;--ink:#1F2933;--muted:#5B6672;--line:#DCD4C2;--line2:#EAE4D4;
  --accent:#2F6DB5;--accent-ink:#FFFFFF;--accent-soft:#E3EEFA;
  --ok:#1E7A46;--ok-soft:#E1F3E8;--warn:#9A5B00;--warn-soft:#FFF1D6;--bad:#B3261E;--bad-soft:#FCE7E5;--info-soft:#E8F0FB;
  --seyes:#C9D6EE;--seyes-m:#F2B8B8;
  --fig-a:#2F6DB5;--fig-b:#D9822B;--fig-c:#3E8E5B;--fig-line:#B9B09C;--fig-soft:#DDE8F6;
  --sc:#2F6DB5;--shadow:0 1px 2px rgba(31,41,51,.08),0 4px 14px rgba(31,41,51,.06);
  --rad:14px;--scale:1;
  --f-head:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;--f-body:'Andika','Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171B21;--surface:#212730;--surface2:#2A313C;--ink:#ECEFF3;--muted:#A9B3BF;--line:#3A4350;--line2:#2E3641;
  --accent:#8DB6EA;--accent-ink:#10202F;--accent-soft:#25344A;
  --ok:#7FD3A0;--ok-soft:#1F3A2A;--warn:#F0BE6A;--warn-soft:#3C2F16;--bad:#FF9C94;--bad-soft:#412321;--info-soft:#243247;
  --seyes:#34415A;--seyes-m:#5B3A3F;
  --fig-a:#8DB6EA;--fig-b:#F0A862;--fig-c:#8FD0A5;--fig-line:#5A6574;--fig-soft:#2F3F57;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171B21;--surface:#212730;--surface2:#2A313C;--ink:#ECEFF3;--muted:#A9B3BF;--line:#3A4350;--line2:#2E3641;
  --accent:#8DB6EA;--accent-ink:#10202F;--accent-soft:#25344A;
  --ok:#7FD3A0;--ok-soft:#1F3A2A;--warn:#F0BE6A;--warn-soft:#3C2F16;--bad:#FF9C94;--bad-soft:#412321;--info-soft:#243247;
  --seyes:#34415A;--seyes-m:#5B3A3F;
  --fig-a:#8DB6EA;--fig-b:#F0A862;--fig-c:#8FD0A5;--fig-line:#5A6574;--fig-soft:#2F3F57;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(1.05rem*var(--scale,1));line-height:1.6}
.shell{--sc:var(--accent);min-height:100vh;display:flex;flex-direction:column}
.shell.p-sana{--accent:#2F6DB5;--accent-soft:#E3EEFA}
.shell.p-milad{--accent:#C9572F;--accent-soft:#FCE9E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shell.p-sana{--accent:#8DB6EA;--accent-soft:#25344A}:root:not([data-theme="light"]) .shell.p-milad{--accent:#F0A98B;--accent-soft:#40291F}}
:root[data-theme="dark"] .shell.p-sana{--accent:#8DB6EA;--accent-soft:#25344A}
:root[data-theme="dark"] .shell.p-milad{--accent:#F0A98B;--accent-soft:#40291F}
.shell.big{font-size:calc(1.2rem*var(--scale,1))}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px;outline:none}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.2;margin:0 0 .5em;text-wrap:balance}
.h1{font-size:2rem}.h2{font-size:1.5rem}.h3{font-size:1.2rem}.mt{margin-top:1.4em}
.big .h1{font-size:2.3rem}
p{margin:0 0 .8em}.muted{color:var(--muted)}.small{font-size:.88em}.center{text-align:center}
a{color:var(--accent)}a:hover{text-decoration-thickness:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.plain{margin:.3em 0 .8em;padding-left:1.2em}.plain li{margin:.25em 0}
ul.reslist,ul.recs,ul.tlist,ul.badges,ul.sklist,ul.llist{list-style:none;margin:0;padding:0}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:980px;margin:0 auto;padding:6px max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who{flex:1;min-width:0;display:flex;gap:8px;align-items:baseline;font-family:var(--f-head);font-size:1.2rem}
.who-cls{color:var(--muted);font-size:.9rem}.topnav{display:flex;gap:4px}
/* buttons */
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:.45em 1em;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--accent)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.soft{background:var(--accent-soft);border-color:transparent}
.btn.quiet{border-color:transparent;background:transparent}.btn.quiet:hover{background:var(--surface2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:44px;font-size:.88em;padding:.3em .7em}
.btn.big{font-size:1.15em;min-height:54px;padding:.6em 1.3em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:.8em 0}
.inl{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.topbar .lbl{display:none}.topbar .btn.quiet{padding:.45em .7em}}
/* cards */
.card{background:var(--surface);border:2px solid var(--line2);border-radius:var(--rad);padding:18px;margin:0 0 16px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.grid2>.card{margin:0}
.notice{border:2px solid var(--line);border-left-width:6px;border-radius:10px;padding:10px 14px;margin:0 0 14px;background:var(--surface2)}
.notice.info{border-color:var(--accent);background:var(--info-soft)}
.notice.stop{border-color:var(--bad);background:var(--bad-soft)}
.notice ul{margin:.3em 0 0}
.banner.warn{background:var(--warn-soft);color:var(--ink);padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--warn)}
.chip{display:inline-block;font-size:.78em;font-weight:700;padding:.1em .6em;border-radius:99px;background:var(--surface2);border:1.5px solid var(--line);white-space:nowrap}
.chip.st-solid,.chip.st-done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.st-review{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.st-progress,.chip.st-started{background:var(--info-soft);border-color:var(--accent);color:var(--accent)}
.chip.plan{border-style:dashed;color:var(--muted)}
.pill{display:inline-block;min-width:1.5em;padding:0 .4em;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.8em;text-align:center}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--sc,var(--accent));border-radius:99px;transition:width .4s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* home */
.hero{text-align:center;padding:20px 0 10px}
.logo{font-family:var(--f-head);font-size:clamp(2.2rem,8vw,3.4rem);margin:0;color:var(--ink)}
.logo span{color:var(--fig-b)}
.tag{font-size:1.15rem;color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin:14px 0 22px}
.pcard{background:var(--surface);border:3px solid var(--accent);border-radius:20px;padding:22px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:center}
.pcard.p-sana{--accent:#2F6DB5}.pcard.p-milad{--accent:#C9572F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pcard.p-sana{--accent:#8DB6EA}:root:not([data-theme="light"]) .pcard.p-milad{--accent:#F0A98B}}
:root[data-theme="dark"] .pcard.p-sana{--accent:#8DB6EA}:root[data-theme="dark"] .pcard.p-milad{--accent:#F0A98B}
.pface{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-head);font-size:2.8rem;display:grid;place-items:center}
.pcard .pname{font-size:1.7rem;margin:.2em 0 0}.pcard .pdesc{color:var(--muted);margin:0}
.pprog{width:100%}.pnum{font-size:.9em;color:var(--muted)}.plast{font-size:.9em;color:var(--muted);margin:0}
.homeinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.homeinfo .card{margin:0}
/* profil */
.today{border-color:var(--accent)}
.tlist{display:flex;flex-direction:column;gap:10px}
.titem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:2px solid var(--line2);border-left:6px solid var(--sc);border-radius:12px;padding:10px 12px;background:var(--surface)}
.tdot{width:42px;height:42px;border-radius:50%;background:var(--sc);color:#fff;display:grid;place-items:center;flex:none}
.tdot .ic{width:22px;height:22px}
.tinfo{flex:1;min-width:180px;display:flex;flex-direction:column}
.tlabel{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .titem,:root:not([data-theme="light"]) .stile{--sc:var(--scd)}:root:not([data-theme="light"]) .tdot{color:#10202F}}
:root[data-theme="dark"] .titem,:root[data-theme="dark"] .stile{--sc:var(--scd)}:root[data-theme="dark"] .tdot{color:#10202F}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px;margin-bottom:18px}
.stile{font:inherit;color:inherit;text-align:left;display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line2);border-top:6px solid var(--sc);border-radius:14px;padding:12px;cursor:pointer;min-height:76px}
.stile:hover{border-color:var(--sc)}
.sico{width:46px;height:46px;border-radius:12px;background:var(--sc);color:#fff;display:grid;place-items:center;flex:none}.sico .ic{width:26px;height:26px}
.stx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.smeta{font-size:.85em;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sico{color:#10202F}}
:root[data-theme="dark"] .sico{color:#10202F}
.quickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.badges li{background:var(--accent-soft);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
/* matière */
.subjhead{border-left:8px solid var(--sc);padding-left:14px;margin-bottom:14px}
.chapter{border-top:6px solid var(--sc)}
.chhead{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.llist{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:2px solid var(--line2);border-radius:10px}
.linfo{flex:1;min-width:160px;display:flex;flex-direction:column}
.chtests{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.planned{background:var(--surface2);border:2px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.planned ul{margin:.3em 0 0;padding-left:1.2em}
.stt{font-size:.85em}
/* leçon */
.lessonhead{border-left:8px solid var(--sc);padding-left:14px;margin-bottom:12px}
.crumb{margin:0;color:var(--muted);font-size:.9em}
.lsteps ol{list-style:none;display:flex;gap:4px;padding:0;margin:0 0 14px;overflow-x:auto;scrollbar-width:thin}
.lsteps li{flex:1 0 auto}
.lsteps button{width:100%;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;min-height:56px;border:2px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer}
.lsteps .num{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.85em}
.lsteps .nm{font-size:.78em;white-space:nowrap}
.lsteps li.cur button{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.lsteps li.cur .num{background:var(--accent);color:var(--accent-ink)}
.lsteps li.past .num{background:var(--ok-soft);color:var(--ok)}
.big .lsteps .nm{font-size:.9em}
.objective{background:var(--accent-soft);border-radius:16px;padding:22px;margin-bottom:14px;text-align:center}
.obj-k{font-family:var(--f-head);font-size:1.2rem;margin:0 0 .3em;color:var(--muted)}
.obj-t{font-family:var(--f-head);font-size:1.7rem;margin:0;line-height:1.25}
.meta{color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbody{min-height:200px}
.lessontxt{font-size:1.08em}
.lessontxt p{max-width:68ch}
.seyes{background-image:linear-gradient(to bottom,transparent 0,transparent calc(100% - 1px),var(--seyes) 100%);background-size:100% 2rem;background-color:var(--surface);background-position:0 .6rem}
.lessontxt.seyes{line-height:2rem}
.problem.seyes{padding:8px 12px;border-left:3px solid var(--seyes-m);border-radius:6px;line-height:2rem;margin-bottom:10px}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line2)}
.lcount{color:var(--muted)}
.visual{margin:12px 0;padding:12px;border:2px solid var(--line2);border-radius:12px;background:var(--surface)}
.demo input[type=text]{font:inherit;font-size:1.3em;padding:.3em .6em;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:100%}
.slidegrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin-bottom:10px}
.slidegrid input[type=range]{width:100%;min-height:36px;accent-color:var(--accent)}
.slidegrid select,select{font:inherit;padding:.4em .6em;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:44px;max-width:100%}
.figrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:8px 0}
.fig{max-width:100%;height:auto;color:var(--ink)}
.figcap{color:var(--muted);font-size:.9em}
.bigfr{font-family:var(--f-head);font-size:1.5rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-family:var(--f-head);margin:0 .1em}
.fr sup,.fr sub{font-size:.9em;vertical-align:baseline;border-bottom:0}
.fr sup{border-bottom:2px solid currentColor;padding:0 .2em}
.fr{font-size:0}.fr sup,.fr sub{font-size:1rem;display:block}
.stepper{border:2px solid var(--line2);border-radius:12px;padding:12px;background:var(--surface2);margin:10px 0}
.stframe{overflow-x:auto;padding:6px 0;min-height:120px}
.stsay{min-height:3.4em;font-size:1.05em;margin:6px 0 10px;padding:8px 12px;background:var(--surface);border-left:5px solid var(--fig-b);border-radius:6px}
.stcount{flex:1;text-align:center;color:var(--muted)}
.stepper .row{margin:0;justify-content:space-between;flex-wrap:nowrap}
/* opérations posées */
table.calc{border-collapse:collapse;font-family:'Andika',ui-monospace,monospace;font-size:1.7rem;margin:6px auto;color:var(--ink)}
table.calc td{min-width:1.35em;height:1.9em;text-align:center;padding:0 .12em;position:relative;font-variant-numeric:tabular-nums}
table.calc td.ln{border-bottom:3px solid var(--ink);padding:0}
table.calc td.sign{color:var(--muted)}
table.calc td.hl{background:var(--fig-soft);border-radius:6px}
table.calc td.res{font-weight:700;color:var(--fig-a)}
table.calc td.divisor{border-bottom:3px solid var(--ink);text-align:left;padding-left:.4em}
table.calc td.vsep{border-left:3px solid var(--ink);padding:0}
table.calc td.quot{text-align:left;padding-left:.4em;font-weight:700;color:var(--fig-b)}
table.calc .qd.hl{background:var(--fig-soft);border-radius:4px;padding:0 .1em}
table.calc sup.rt{font-size:.5em;color:var(--fig-b);font-weight:700;position:absolute;top:.15em;left:-.1em}
table.calc tr.carryrow td{height:1.1em;font-size:.8em}
table.calc tr.rule td{height:0;line-height:0}
/* exemple */
.example{border:2px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--surface)}
.wsteps{padding-left:1.4em}.wsteps li{margin:.7em 0}
.wsteps .do{display:block;font-weight:700}
.why2{display:block;margin-top:.15em;padding:6px 10px;background:var(--warn-soft);border-radius:8px;font-size:.95em}
.answerline{font-weight:700;color:var(--ok);display:flex;gap:8px;align-items:center}
.fiche{background:var(--surface);border:3px solid var(--sc,var(--accent));border-radius:14px;padding:14px 18px;margin-bottom:14px}
.fiche-t{font-family:var(--f-head);font-size:1.4rem;color:var(--accent);margin:0 0 .4em}
.keeplist{margin:0;padding-left:1.2em}.keeplist li{margin:.4em 0}
.pitfalls{margin-top:14px}
.pit{border:2px solid var(--line2);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:var(--surface)}
.pit p{margin:.2em 0;display:flex;gap:8px;align-items:flex-start}
.pit .bad{color:var(--bad)}.pit .good{color:var(--ok)}
.pit .ic{margin-top:.25em}.whyp{color:var(--muted);font-size:.92em}
.parentguide{border:2px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px;padding:0}
.parentguide>summary{cursor:pointer;padding:10px 14px;font-weight:700;min-height:44px}
.pgbody{padding:0 16px 12px}.pgbody h4{margin:.8em 0 .2em}
.lk{font-weight:600}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lvbtn{flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:14px}
.lvbtn span{font-weight:400;font-size:.85em;color:var(--muted)}
.lvbtn.lv1{border-left:8px solid var(--ok)}.lvbtn.lv2{border-left:8px solid var(--fig-b)}.lvbtn.lv3{border-left:8px solid var(--bad)}
/* séries */
.runner{margin-bottom:20px}
.rhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.rmeta{display:flex;gap:14px;color:var(--muted);align-items:center}
.timer{display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.qmap{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.qdot{font:inherit;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.qdot.cur{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.qdot.answered{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qcard{background:var(--surface);border:2px solid var(--line2);border-radius:var(--rad);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.qcard[hidden]{display:none}
.qprompt{font-family:var(--f-body);font-weight:600;font-size:1.2rem;line-height:1.5;margin:0 0 12px}
.big .qprompt{font-size:1.45rem}
.passage{background:var(--surface2);border-left:6px solid var(--fig-b);border-radius:8px;padding:12px 16px;margin-bottom:12px;font-size:1.05em;line-height:1.7}

<script>(function(){'use strict';
var LM={};
/* --- core.js --- */
/* ===== core.js : utilitaires, vérification des réponses, état ===== */
LM.VERSION = 1;
LM.NB = ' ';
LM.esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };

/* ---------- aléatoire reproductible ---------- */
LM.rng = function (seed) {
  var a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
LM.ri = function (r, a, b) { return a + Math.floor(r() * (b - a + 1)); };
LM.pick = function (r, a) { return a[Math.floor(r() * a.length)]; };
LM.shuffle = function (r, a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
LM.sample = function (r, a, n) { return LM.shuffle(r, a).slice(0, n); };
LM.seed = function () { return (Math.random() * 4294967296) >>> 0; };

/* ---------- formats français ---------- */
LM.clean = function (n) { return +(+n).toFixed(9); };
LM.fmt = function (n, dec) {
  n = LM.clean(n);
  var neg = n < 0; n = Math.abs(n);
  var s = dec === undefined ? String(n) : n.toFixed(dec);
  var p = s.split('.'); var i = p[0], f = p[1];
  if (i.length >= 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, LM.NB);
  return (neg ? '−' : '') + i + (f ? ',' + f : '');
};
LM.eur = function (n) { return LM.fmt(n, 2) + LM.NB + '€'; };
LM.digits = function (n) { return String(n).split('').map(Number); };

/* ---------- lecture des nombres saisis ---------- */
LM.parseNum = function (s) {
  if (typeof s === 'number') return s;
  if (s == null) return null;
  s = String(s).toLowerCase().replace(/[   \s]/g, '').replace(/−/g, '-');
  if (!s) return null;
  var m = s.match(/^(-?[\d.,]+(?:\/[\d.,]+)?)([a-zµ€²³°%]*)$/);
  if (!m) return null;
  var core = m[1];
  if (/^\d{1,3}(\.\d{3})+$/.test(core)) core = core.replace(/\./g, '');
  core = core.replace(/,/g, '.');
  if (core.indexOf('/') >= 0) {
    var q = core.split('/'); var a = parseFloat(q[0]), b = parseFloat(q[1]);
    if (!isFinite(a) || !isFinite(b) || b === 0) return null;
    return a / b;
  }
  if (!/^-?\d*\.?\d+$/.test(core) && !/^-?\d+\.?$/.test(core)) return null;
  var v = parseFloat(core);
  return isFinite(v) ? v : null;
};
LM.parseFrac = function (s) {
  s = String(s || '').replace(/[\s  ]/g, '');
  var m = s.match(/^(\d+)\/(\d+)$/);
  if (!m) return null;
  return { n: +m[1], d: +m[2] };
};
LM.parseTime = function (s) {
  s = String(s || '').toLowerCase().replace(/\s/g, '').replace(/min$/, '').replace(/[:.]/, 'h');
  var m = s.match(/^(\d{1,2})h(\d{0,2})$/);
  if (!m) return null;
  var h = +m[1], mi = m[2] === '' ? 0 : +m[2];
  if (h > 24 || mi > 59) return null;
  return { h: h, m: mi };
};
LM.normText = function (s, loose, keepCase, keepPunct) {
  s = String(s == null ? '' : s).replace(/[’‘`´]/g, "'").replace(/[  ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!keepCase) s = s.toLowerCase();
  if (!keepPunct) s = s.replace(/\s*[.!?…]+$/, '');
  if (loose) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s;
};
LM.gcd = function (a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; };

/* ---------- blancs {{...}} ---------- */
LM.parseBlanks = function (q) {
  var parts = [], blanks = [], re = /\{\{([^}]*)\}\}/g, last = 0, m;
  while ((m = re.exec(q))) {
    parts.push(q.slice(last, m.index)); last = re.lastIndex;
    blanks.push(m[1].indexOf('|') >= 0 ? { opts: m[1].split('|') } : {});
  }
  parts.push(q.slice(last));
  return { parts: parts, blanks: blanks };
};

/* ---------- types de questions ---------- */
var T = LM.T = {};
function arr(x) { return Array.isArray(x) ? x : [x]; }

T.mcq = {
  check: function (Q, r) {
    if (r == null || r === '') return { ok: false, score: 0, empty: true };
    var ok = +r === Q.a; return { ok: ok, score: ok ? 1 : 0 };
  },
  solve: function (Q) { return Q.a; },
  wrong: function (Q) { return (Q.a + 1) % Q.opts.length; },
  text: function (Q) { return Q.opts[Q.a]; }
};
T.num = {
  check: function (Q, r) {
    if (r == null || String(r).trim() === '') return { ok: false, score: 0, empty: true };
    var v = LM.parseNum(r);
    if (v === null) return { ok: false, score: 0, msg: 'Écris un nombre (par exemple 12 ou 3,5).' };
    var tol = Q.tol || 1e-9;
    var ok = arr(Q.a).some(function (a) { return Math.abs(v - a) <= tol * Math.max(1, Math.abs(a)); });
    return { ok: ok, score: ok ? 1 : 0 };
  },
  solve: function (Q) { return LM.fmt(arr(Q.a)[0]); },
  wrong: function (Q) { return LM.fmt(arr(Q.a)[0] + 7); },
  text: function (Q) { return LM.fmt(arr(Q.a)[0]) + (Q.unit ? LM.NB + Q.unit : ''); }
};
T.frac = {
  check: function (Q, r) {
    var f = LM.parseFrac(r);
    if (!String(r || '').trim()) return { ok: false, score: 0, empty: true };
    if (!f || f.d === 0) return { ok: false, score: 0, msg: 'Écris une fraction comme 3/4.' };
    var ok = Q.exact ? (f.n === Q.a.n && f.d === Q.a.d) : (f.n * Q.a.d === f.d * Q.a.n);
    if (!ok) return { ok: false, score: 0 };
    return { ok: true, score: 1 };
  },
  solve: function (Q) { return Q.a.n + '/' + Q.a.d; },
  wrong: function (Q) { return (Q.a.n + 1) + '/' + (Q.a.d + 1); },
  text: function (Q) { return '<span class="fr"><sup>' + Q.a.n + '</sup>⁄<sub>' + Q.a.d + '</sub></span>'; }
};
T.time = {
  check: function (Q, r) {
    if (!String(r || '').trim()) return { ok: false, score: 0, empty: true };
    var t = LM.parseTime(r);
    if (!t) return { ok: false, score: 0, msg: 'Écris l’heure comme 3h30.' };
    var ok = t.m === Q.a.m && (Q.mod12 ? (t.h % 12 === Q.a.h % 12) : t.h === Q.a.h);
    return { ok: ok, score: ok ? 1 : 0 };
  },
  solve: function (Q) { return Q.a.h + 'h' + (Q.a.m < 10 ? '0' : '') + Q.a.m; },
  wrong: function (Q) { return ((Q.a.h + 1) % 24) + 'h' + (Q.a.m < 10 ? '0' : '') + Q.a.m; },
  text: function (Q) { return Q.a.h + ' h ' + (Q.a.m < 10 ? '0' : '') + Q.a.m; }
};
T.text = {
  check: function (Q, r) {
    if (!String(r || '').trim()) return { ok: false, score: 0, empty: true };
    var acc = arr(Q.a);
    var h = function (x) { return Q.nohyph ? String(x).replace(/-/g, ' ') : x; };
    var f = function (x) { return LM.normText(h(x), false, Q.cs, Q.punct); };
    var fl = function (x) { return LM.normText(h(x), true, Q.cs, Q.punct); };
    var u = f(r);
    if (acc.some(function (a) { return f(a) === u; })) return { ok: true, score: 1 };
    if (Q.loose && acc.some(function (a) { return fl(a) === fl(r); })) return { ok: true, score: 1 };
    if (acc.some(function (a) { return fl(a) === fl(r); })) return { ok: false, score: 0, msg: 'Presque ! Regarde bien les accents.' };
    if (Q.cs === undefined && false) return { ok: false, score: 0 };
    return { ok: false, score: 0 };
  },
  solve: function (Q) { return arr(Q.a)[0]; },
  wrong: function () { return 'zzz'; },
  text: function (Q) { return LM.esc(arr(Q.a)[0]); }
};
T.fill = {
  check: function (Q, r) {
    var n = Q.blanks.length, good = 0, any = false, accent = false;
    for (var i = 0; i < n; i++) {
      var v = (r && r[i] != null) ? String(r[i]) : '';
      if (v.trim()) any = true;
      var acc = arr(Q.a[i]);
      var f = function (x) { return LM.normText(x, false, Q.cs, true).replace(/\s*[.!?…]+$/, ''); };
      if (acc.some(function (a) { return f(a) === f(v) && v.trim(); })) good++;
      else if (v.trim() && acc.some(function (a) { return LM.normText(a, true) === LM.normText(v, true); })) accent = true;
    }
    if (!any) return { ok: false, score: 0, empty: true };
    return { ok: good === n, score: good / n, msg: accent ? 'Presque ! Regarde bien les accents.' : null };
  },
  solve: function (Q) { return Q.a.map(function (a) { return arr(a)[0]; }); },
  wrong: function (Q) { return Q.a.map(function () { return 'zzz'; }); },
  text: function (Q) { return Q.a.map(function (a) { return '<b>' + LM.esc(arr(a)[0]) + '</b>'; }).join(' ; '); }
};
T.order = {
  check: function (Q, r) {
    if (!r || !r.length) return { ok: false, score: 0, empty: true };
    var orders = [Q.items].concat(Q.alts || []);
    var best = 0;
    orders.forEach(function (o) { var c = 0; o.forEach(function (x, i) { if (r[i] === x) c++; }); if (c > best) best = c; });
    var ok = best === Q.items.length;
    return { ok: ok, score: best / Q.items.length };
  },
  solve: function (Q) { return Q.items.slice(); },
  wrong: function (Q) { var x = Q.items.slice(); x.reverse(); if (x.join() === Q.items.join()) x.push(x.shift()); return x; },
  text: function (Q) { return Q.items.map(LM.esc).join(' → '); }
};
T.match = {
  check: function (Q, r) {
    if (!r || r.every(function (x) { return !x; })) return { ok: false, score: 0, empty: true };
    var c = 0; Q.pairs.forEach(function (p, i) { if (r[i] === p[1]) c++; });
    return { ok: c === Q.pairs.length, score: c / Q.pairs.length };

  solve: function (Q) { return Q.pairs.map(function (p) { return p[1]; }); },
  wrong: function (Q) { return Q.pairs.map(function (p, i) { return Q.pairs[(i + 1) % Q.pairs.length][1]; }); },
  text: function (Q) { return Q.pairs.map(function (p) { return LM.esc(p[0]) + ' → ' + LM.esc(p[1]); }).join('<br>'); }
};
T.build = {
  check: function (Q, r) {

    var key = r.join(' ');
    var ok = arr(Q.a[0] && Array.isArray(Q.a[0]) ? Q.a : [Q.a]).some(function (a) { return a.join(' ') === key; });
    return { ok: ok, score: ok ? 1 : 0 };
  },
  solve: function (Q) { return (Array.isArray(Q.a[0]) ? Q.a[0] : Q.a).slice(); },
  wrong: function (Q) { var s = (Array.isArray(Q.a[0]) ? Q.a[0] : Q.a).slice(); s.reverse(); return s; },
  text: function (Q) { return LM.esc((Array.isArray(Q.a[0]) ? Q.a[0] : Q.a).join(' ')); }
};
T.steps = {
  check: function (Q, r) {
    var n = Q.steps.length, good = 0, any = false, per = [];
    Q.steps.forEach(function (s, i) {
      var v = r && r[i] != null ? String(r[i]) : '';
      if (v.trim()) any = true;
      var ok;
      if (s.kind === 'text' || typeof arr(s.a)[0] === 'string') ok = arr(s.a).some(function (a) { return LM.normText(a, !!s.loose) === LM.normText(v, !!s.loose) && v.trim(); });
      else { var x = LM.parseNum(v); ok = x !== null && arr(s.a).some(function (a) { return Math.abs(x - a) < 1e-9; }); }
      per.push(!!ok); if (ok) good++;

    if (!any) return { ok: false, score: 0, empty: true };
    return { ok: good === n, score: good / n, per: per };
  },
  solve: function (Q) { return Q.steps.map(function (s) { var a = arr(s.a)[0]; return typeof a === 'number' ? LM.fmt(a) : a; }); },
  wrong: function (Q) { return Q.steps.map(function () { return '9999999'; }); },
  text: function (Q) { return Q.steps.map(function (s, i) { var a = arr(s.a)[0]; return (i + 1) + '. ' + (typeof a === 'number' ? LM.fmt(a) : LM.esc(a)); }).join(' ; '); }
};
T.numline = {
  check: function (Q, r) {

/* ---------- instanciation d'une question de lot ---------- */
LM.GEN = LM.GEN || {};
LM.inst = function (item, seed, ctx) {
  ctx = ctx || {};
  var r = LM.rng(seed);
  var Q;
  if (item.g) {
    var g = LM.GEN[item.g];
    if (!g) throw new Error('Générateur inconnu ' + item.g);
    Q = g(r, item.lvl || 1, item);
    Q.gid = item.g;
  } else {
    Q = JSON.parse(JSON.stringify(item));
  }
  Q.lvl = item.lvl || Q.lvl || 1;
  Q.skill = item.skill || Q.skill || ctx.skill;
  Q.lesson = ctx.lesson || Q.lesson;
  Q.qid = (ctx.lesson || '') + '#' + (item.g || item.id || item.q && item.q.slice(0, 24) || '');
  var rr = LM.rng(seed ^ 0x9e3779b9);
  if (Q.type === 'mcq') {
    Q.order = Q.noShuffle ? Q.opts.map(function (_, i) { return i; }) : LM.shuffle(rr, Q.opts.map(function (_, i) { return i; }));
  } else if (Q.type === 'order') {
    var s = LM.shuffle(rr, Q.items); var tries = 0;
    while (s.join('|') === Q.items.join('|') && tries++ < 5) s = LM.shuffle(rr, Q.items);
    Q.shuf = s;
  } else if (Q.type === 'match') {
    Q.rightOrder = LM.shuffle(rr, Q.pairs.map(function (p) { return p[1]; }).filter(function (x, i, a) { return a.indexOf(x) === i; }));
  } else if (Q.type === 'build') {
    Q.bag = LM.shuffle(rr, Q.words || (Array.isArray(Q.a[0]) ? Q.a[0] : Q.a));
  } else if (Q.type === 'fill') {
    var pb = LM.parseBlanks(Q.q); Q.parts = pb.parts; Q.blanks = pb.blanks;
  }
  return Q;
};

/* groupe de lecture : plusieurs questions autour d'un texte */
LM.expandItem = function (item, seed, ctx) {
  if (item.grp) {
    return item.items.map(function (it, i) {
      var Q = LM.inst(Object.assign({ lvl: item.lvl, skill: item.skill }, it), seed + i, ctx);
      Q.passage = item.passage; Q.passageTitle = item.title; Q.say = item.say;
      return Q;
    });
  }
  return [LM.inst(item, seed, ctx)];
};

  blank: function () { return { v: 1, created: Date.now(), profiles: { sana: LM.newProfile('sana'), milad: LM.newProfile('milad') } }; },
  load: function () {
    var raw = null;
    try { raw = localStorage.getItem(this.key); } catch (e) { this.persistent = false; }
    if (raw) { try { this.data = JSON.parse(raw); } catch (e) { this.data = null; } }

      var base = LM.newProfile(id), pr = this.data.profiles[id];
      for (var k in base) if (pr[k] === undefined) pr[k] = base[k];
      for (var k2 in base.settings) if (pr.settings[k2] === undefined) pr.settings[k2] = base.settings[k2];
    }
    return this.data;
  },
  save: function () {

  },
  exportAll: function () { return JSON.stringify({ app: 'cartable-maison', v: 1, exported: new Date().toISOString(), data: this.data }); },

  function poly(pts, fill, stroke, sw) { return '<polygon points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '" fill="' + (fill || 'none') + '" stroke="' + (stroke || C.ink) + '" stroke-width="' + (sw || 2) + '" stroke-linejoin="round"/>'; }

  var F = LM.FIG = {};

  F.blocks = function (s) {

    return svg(Math.max(w, 60), 56, body, (c ? c + ' centaines, ' : '') + (d ? d + ' dizaines, ' : '') + (u ? u + ' unités' : ''), 'fig-blocks');

  F.tenframe = function (s) {

  F.groups = function (s) { // g boîtes contenant per objets

    if (picked && picked.indexOf(l.id) >= 0) { score += 10; hits.unshift('(coché)'); }
    if (score >= 3) out.push({ lesson: l, score: score, hits: hits.slice(0, 6) });
  });
  out.sort(function (a, b) { return b.score - a.score; });

};

/* helpers français : fabrique de leçons compacte */
(function () {
  var S = LM.S;
  /* o : id,title,min,ob,pre,expl,vis (html),ex[{title,problem,steps,answer}],keep,err,pool,skills{},kw,parent{how,ask,watch}
     guided = 2 premières questions de niveau 1 du pool */
  LM.mkL = function (o) {
    var l = {
      id: o.id, title: o.title, min: o.min || 15, ob: o.ob, pre: o.pre || [LM.pre('Savoir lire des phrases simples.')],
      expl: o.expl, visIntro: o.visIntro || 'Regarde l’exemple.', vis: o.visList || [{ type: 'html', caption: o.cap || 'Exemple', html: o.vis }],
      ex: o.ex, keep: o.keep, err: o.err, pool: o.pool, skills: o.skills, kw: o.kw,
      parent: { how: o.parent.how, ask: o.parent.ask, watch: o.parent.watch, time: (o.min || 15) + ' minutes.' }
    };
    l.pool.forEach(function (q) { if (!q.g && !q.grp && q.type === 'mcq' && q.why && q.why.length < 24) q.why = q.why.replace(/\.?$/, '') + '. La bonne réponse : « ' + q.opts[q.a] + ' ».'; });
    l.guided = o.guided || o.pool.filter(function (q) { return !q.grp && (q.lvl || 1) === 1; }).slice(0, 2);
    return l;
  };
  /* tableau HTML simple */
  LM.tbl = function (head, rows) {
    return '<div class="tablewrap"><table class="data"><thead><tr>' + head.map(function (h) { return '<th scope="col">' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  };
  /* question « quelle est la nature / le sujet… » : mcq à 4 choix à partir d'une bonne réponse */
  LM.M = function (q, good, wrongs, why, hint, lvl, x) { return S.mc(q, good, wrongs, why, [].concat(hint), lvl, x); };
})();

/* ===== finalisation : ordre des leçons, couverture, éléments « à venir » ===== */
(function () {
  LM.COVERAGE = { sana: {}, milad: {} };
  ['sana', 'milad'].forEach(function (pid) {
    var C = LM.CUR[pid];
    C.subjects.forEach(function (s) {
      var total = 0, have = 0, regs = LM.chaptersOf(pid, s.id), planned = [];
      s.chapters.forEach(function (cc) {
        var reg = regs.filter(function (r) { return r.id === cc.id; })[0];
        total += cc.lessons.length;
        if (!reg) { planned.push(cc.title + ' <span class="muted">(' + cc.lessons.length + ' leçon' + (cc.lessons.length > 1 ? 's' : '') + ')</span>'); return; }
        var order = cc.lessons.map(function (l) { return l.id; });
        reg.lessonIds.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
        reg.planned = cc.lessons.filter(function (l) { return !LM.LESSONS[l.id]; }).map(function (l) { return l.title; });
        have += reg.lessonIds.length;
      });
      /* chapitres enregistrés qui ne figurent pas dans le programme listé */
      regs.forEach(function (r) { if (!s.chapters.some(function (cc) { return cc.id === r.id; })) { total += r.lessonIds.length; have += r.lessonIds.length; } });
      regs.sort(function (a, b) { var ia = -1, ib = -1; s.chapters.forEach(function (cc, i) { if (cc.id === a.id) ia = i; if (cc.id === b.id) ib = i; }); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
      LM.PLANNED[pid][s.id] = planned;
      var ratio = total ? have / total : 0, level = have === 0 ? 'planned' : (ratio >= 0.9 ? 'complete' : (ratio >= 0.45 ? 'substantial' : 'intro'));
      LM.COVERAGE[pid][s.id] = { level: level, have: have, total: total, note: have + ' leçon' + (have > 1 ? 's' : '') + ' prête' + (have > 1 ? 's' : '') + ' sur ' + total + ' prévues.' };
    });
  });
})();

  var P = ['je', 'tu', 'il / elle', 'nous', 'vous', 'ils / elles'], rows = '';
  var ender = { 'imparfait': ['ais', 'ais', 'ait', 'ions', 'iez', 'aient'], 'futur': ['ai', 'as', 'a', 'ons', 'ez', 'ont'] }[t];
  for (var i = 0; i < 6; i++) {
    var f = LM.conjForm(inf, t, i), shown = esc(f);
    if (ender && f.slice(-ender[i].length) === ender[i]) shown = esc(f.slice(0, -ender[i].length)) + '<b class="endg">' + ender[i] + '</b>';
    var pr = P[i]; if (i === 0 && /^[aeiouhéèêàâîïôû]/i.test(f)) pr = 'j’';
    rows += '<tr><th scope="row">' + pr + '</th><td>' + shown + '</td></tr>';
  }
  var note = t === 'imparfait' ? '<p class="muted">Radical : « nous » au présent (' + v.pres[3] + ') sans -ons → <strong>' + v.impS + '</strong>' + (v.imp2 !== v.impS ? ' (et <strong>' + v.imp2 + '</strong> pour nous et vous)' : '') + '. Les terminaisons <b class="endg">en couleur</b> sont toujours les mêmes.</p>' : (t === 'futur' ? '<p class="muted">Radical du futur : <strong>' + v.fut + '</strong>, puis les terminaisons <b class="endg">en couleur</b>.</p>' : '');
  box.querySelector('.cjout').innerHTML = '<div class="tablewrap"><table class="data conj"><caption>' + esc(inf) + ' — ' + esc(t) + '</caption><tbody>' + rows + '</tbody></table></div>' + note;
};

ACT.arm = function (el) { var b = el.closest('.ar'), k = el.dataset.k, v = +b.dataset[k] + (+el.dataset.s); b.dataset[k] = Math.max(1, Math.min(k === 'r' ? 6 : 10, v)); UI.arDraw(b); };

UI.visualHTML = function (vis) {
  if (!vis) return '';
  var list = Array.isArray(vis) ? vis : [vis], out = '';
  list.forEach(function (d) {
    if (d.caption) out += '<h3 class="h3">' + d.caption + '</h3>';
    if (d.type === 'html') out += '<div class="visual">' + d.html + '</div>';
    else if (d.type === 'fig') out += '<div class="visual">' + LM.fig(d.fig) + (d.note ? '<p class="figcap">' + d.note + '</p>' : '') + '</div>';
    else if (DEMO[d.type]) { var id = ++demoN; d._id = id; out += '<div class="visual" data-demo="' + d.type + '" data-demoid="' + id + '">' + DEMO[d.type].html(d, id) + '</div>'; }
  });
  return out;
};
UI.mountVisuals = function (root) {
  root.querySelectorAll('[data-demo]').forEach(function (v) { var t = v.dataset.demo; if (DEMO[t] && DEMO[t].mount) DEMO[t].mount(v, v.dataset.demoid); });
};

/* ---------- page de leçon ---------- */
UI.LSTEPS = [
  { id: 'obj', t: 'Objectif', kid: 'Je vais apprendre' },
  { id: 'expl', t: 'J’apprends', kid: 'J’apprends' },
  { id: 'vis', t: 'Je regarde', kid: 'Je regarde' },
  { id: 'ex', t: 'Exemple', kid: 'Exemple' },
  { id: 'keep', t: 'À retenir', kid: 'À retenir' },
  { id: 'guided', t: 'Je m’entraîne', kid: 'Avec aide' },
  { id: 'ex2', t: 'Exercices', kid: 'Exercices' },
  { id: 'quiz', t: 'Quiz', kid: 'Quiz' }
];
UI.stepOf = function (l) { return Math.min(UI.LSTEPS.length - 1, S.lessonStep[l.id] || 0); };

function listHTML(arr, cls) {
  if (!arr || !arr.length) return '';
  return '<ul class="' + (cls || 'plain') + '">' + arr.map(function (x) {
    if (typeof x === 'string') return '<li>' + x + '</li>';
    return '<li>' + x.t + (x.l && LM.LESSONS[x.l] ? ' <a href="#" class="lk" data-a="openLesson" data-id="' + x.l + '">Revoir : ' + esc(LM.LESSONS[x.l].title) + '</a>' : '') + '</li>';
  }).join('') + '</ul>';
}
UI.exampleHTML = function (ex) {
  var out = '';
  ex.forEach(function (e, n) {
    out += '<article class="example"><h3 class="h3">' + (e.title || 'Exemple ' + (n + 1)) + '</h3><div class="problem seyes">' + (e.problem || '') + '</div>';
    if (e.calc) out += UI.visualHTML({ type: 'stepper', calc: e.calc });
    if (e.steps) out += '<ol class="wsteps">' + e.steps.map(function (s) { return '<li><span class="do">' + s.do + '</span>' + (s.why ? '<span class="why2"><b>Pourquoi ?</b> ' + s.why + '</span>' : '') + '</li>'; }).join('') + '</ol>';
    if (e.answer) out += '<p class="answerline">' + icon('check') + e.answer + '</p>';
    out += '</article>';
  });
  return out;
};
UI.keepHTML = function (l) {
  return '<aside class="fiche" aria-label="À retenir"><h3 class="fiche-t">À retenir</h3>' + listHTML(l.keep, 'keeplist') + '</aside>' +
    ((l.err && l.err.length) ? '<section class="pitfalls"><h3 class="h3">Les pièges à éviter</h3>' + l.err.map(function (e) { return '<div class="pit"><p class="bad">' + icon('cross') + '<span>' + e.bad + '</span></p><p class="good">' + icon('check') + '<span>' + e.good + '</span></p>' + (e.why ? '<p class="whyp">' + e.why + '</p>' : '') + '</div>'; }).join('') + '</section>' : '');
};
UI.parentGuideHTML = function (l) {
  var g = l.parent; if (!g) return '';
  return '<details class="parentguide noprint"><summary>' + icon('user') + ' Guide pour l’adulte</summary><div class="pgbody">' +
    (g.how ? '<h4>Comment l’expliquer</h4>' + (Array.isArray(g.how) ? listHTML(g.how) : '<p>' + g.how + '</p>') : '') +
    (g.ask ? '<h4>Questions à poser</h4>' + listHTML(g.ask) : '') +
    (g.watch ? '<h4>Erreurs à surveiller</h4>' + listHTML(g.watch) : '') +
    (g.time ? '<p class="muted">' + g.time + '</p>' : '') + '</div></details>';
};

VIEWS.lesson = function (v) {
  var l = LM.LESSONS[v.id], pid = v.profile, P = LM.P(pid), kid = UI.kid(pid);
  if (!l) return { html: '<div class="card"><p>Leçon introuvable.</p></div>' };
  if (!P.seen[l.id]) { P.seen[l.id] = Date.now(); UI.save(); }
  var step = UI.stepOf(l), cur = UI.LSTEPS[step], c = UI.subjectColor(l.subject), n = UI.LSTEPS.length;
  var stepper = '<nav class="lsteps" aria-label="Étapes de la leçon"><ol>' + UI.LSTEPS.map(function (s, i) {
    return '<li class="' + (i === step ? 'cur' : (i < step ? 'past' : '')) + '"><button type="button" data-a="lgo" data-i="' + i + '" ' + (i === step ? 'aria-current="step"' : '') + '><span class="num">' + (i + 1) + '</span><span class="nm">' + (kid ? s.kid : s.t) + '</span></button></li>';
  }).join('') + '</ol></nav>';
  var body = '';
  if (cur.id === 'obj') {
    body += '<div class="objective"><p class="obj-k">Aujourd’hui, je vais apprendre à…</p><p class="obj-t">' + l.ob + '</p></div>';
    if (l.pre && l.pre.length) body += '<section class="card"><h3 class="h3">' + (kid ? 'Avant de commencer, je dois savoir' : 'Avant de commencer, il faut déjà savoir') + '</h3>' + listHTML(l.pre) + '</section>';
    body += '<p class="meta">' + icon('clock') + ' Environ ' + l.min + ' minutes · ' + UI.chip('c-' + l.subject, esc(LM.SUBJECTS[l.subject].name)) + '</p>';
  } else if (cur.id === 'expl') {
    body += '<section class="card seyes lessontxt" lang="fr"><h2 class="h2">' + esc(l.title) + '</h2>' + (Array.isArray(l.expl) ? l.expl.map(function (p) { return p.charAt(0) === '<' ? p : '<p>' + p + '</p>'; }).join('') : l.expl) + '</section>';
  } else if (cur.id === 'vis') {
    body += '<section class="card"><h2 class="h2">' + (kid ? 'Je regarde et j’essaie' : 'Regarde et manipule') + '</h2>' + (l.visIntro ? '<p>' + l.visIntro + '</p>' : '') + UI.visualHTML(l.vis) + '</section>';
  } else if (cur.id === 'ex') {
    body += '<section class="card"><h2 class="h2">' + (kid ? 'Un exemple pas à pas' : 'Exemple détaillé, étape par étape') + '</h2>' + UI.exampleHTML(l.ex || []) + '</section>';
  } else if (cur.id === 'keep') {
    body += UI.keepHTML(l);
  } else if (cur.id === 'guided') {
    body += '<section class="card"><h2 class="h2">' + (kid ? 'Je m’entraîne avec de l’aide' : 'Pratique guidée') + '</h2><p>' + (kid ? 'Tu peux demander un indice. Tu as droit à plusieurs essais.' : 'Tu peux demander des indices progressifs et réessayer. Le but est de comprendre, pas d’aller vite.') + '</p><div id="guided-box"></div></section>';
  } else if (cur.id === 'ex2') {
    var lv = [['Facile', 1], ['Moyen', 2], ['Défi', 3]];
    body += '<section class="card"><h2 class="h2">Exercices</h2><p>' + (kid ? 'Choisis ton niveau. Il y a 6 questions.' : 'Choisis un niveau : 6 questions avec correction immédiate. Tu peux en refaire autant que tu veux : les questions changent.') + '</p><div class="lvgrid">' + lv.map(function (x) { return '<button class="btn lvbtn lv' + x[1] + '" data-a="lex" data-lvl="' + x[1] + '"><strong>' + x[0] + '</strong><span>' + ({ 1: 'pour bien démarrer', 2: 'pour s’entraîner', 3: 'pour se challenger' })[x[1]] + '</span></button>'; }).join('') + '</div></section>';
  } else if (cur.id === 'quiz') {
    var nx = LM.nextLesson(l), st = P.done[l.id];
    body += '<section class="card"><h2 class="h2">' + (kid ? 'Le petit quiz' : 'Quiz de la leçon') + '</h2><p>' + (kid ? '5 questions pour voir si tu as compris.' : '5 questions pour vérifier ce que tu as compris. Les résultats servent à te proposer des révisions.') + '</p>' +
      (st ? '<p class="okline">' + icon('check') + ' Quiz déjà fait le ' + UI.fmtDate(st) + '.</p>' : '') +
      '<div class="row"><button class="btn primary big" data-a="lquiz">' + icon('play') + (st ? 'Refaire le quiz' : 'Commencer le quiz') + '</button></div></section>' +
      '<section class="card soft"><h3 class="h3">Et ensuite ?</h3><div class="row">' + (nx ? '<button class="btn" data-a="openLesson" data-id="' + nx.id + '">' + icon('arrow') + 'Leçon suivante : ' + esc(nx.title) + '</button>' : '') +
      '<button class="btn" data-a="toChapter" data-id="' + l.chapter + '">' + (kid ? 'Retour aux leçons' : 'Retour au chapitre') + '</button></div></section>';
  }
  var nav = '<div class="lnav noprint"><button class="btn" data-a="lstep" data-d="-1"' + (step === 0 ? ' disabled' : '') + '>' + icon('left') + 'Précédent</button><span class="lcount">' + (step + 1) + ' / ' + n + '</span>' + (step < n - 1 ? '<button class="btn primary" data-a="lstep" data-d="1">Suivant' + icon('arrow') + '</button>' : '<span></span>') + '</div>';
  var html = '<div class="lessonhead" style="--sc:' + c + ';--scd:' + UI.subjectDark(l.subject) + '"><p class="crumb">' + esc(LM.SUBJECTS[l.subject].name) + ' · ' + esc(LM.chapterById(l.chapter).title) + '</p><h1 class="h1">' + esc(l.title) + '</h1></div>' + UI.parentGuideHTML(l) + stepper + '<div class="lbody">' + body + '</div>' + nav + UI.leaveBox();
  return {
    title: l.title, html: html, mount: function (root) {
      UI.mountVisuals(root);
      if (cur.id === 'guided') UI.mountGuided(l, pid);
    }

};
UI.mountGuided = function (l, pid) {
  var box = document.getElementById('guided-box'); if (!box) return;
  var key = l.id; UI._guided = UI._guided || {};
  var R = UI._guided[key];
  if (!R || R.finished && R._redo) {
    var qs = []; (l.guided || []).forEach(function (it, i) { qs = qs.concat(LM.expandItem(it, 1000 + i, { lesson: l.id, skill: Object.keys(l.skills || {})[0] })); });
    if (!qs.length) { box.innerHTML = '<p>Pas de pratique guidée pour cette leçon.</p>'; return; }
    R = UI._guided[key] = new UI.Runner({ pid: pid, qs: qs, mode: 'practice', title: 'Pratique guidée', embedded: true, spec: { kind: 'guided', lesson: l.id } });
  }
  R.mount(box);
};
ACT.gredo = function (el) { var R = runnerOf(el); if (R) { delete UI._guided[R.cfg.spec.lesson]; var l = LM.LESSONS[R.cfg.spec.lesson]; UI.mountGuided(l, R.pid); } };
ACT.lgo = function (el) { var v = S.view; S.lessonStep[v.id] = +el.dataset.i; UI.render(); window.scrollTo(0, 0); UI.focusMain(); };
ACT.lstep = function (el) {
  var v = S.view, l = LM.LESSONS[v.id], d = +el.dataset.d, i = UI.stepOf(l) + d;
  S.lessonStep[v.id] = Math.max(0, Math.min(UI.LSTEPS.length - 1, i)); UI.render(); window.scrollTo(0, 0); UI.focusMain();
};
ACT.openLesson = function (el) {
  var l = LM.LESSONS[el.dataset.id];
  UI.confirmLeave(function () { UI.go('lesson', { profile: l.profile, id: l.id }, { replace: S.view.name === 'lesson' }); });
};
ACT.lex = function (el) {
  var v = S.view, sess = LM.buildSession({ kind: 'lesson-exercises', lesson: v.id, lvl: +el.dataset.lvl, n: 6, profile: v.profile });
  UI.startRun(v.profile, sess);
};
ACT.lquiz = function () {
  var v = S.view, sess = LM.buildSession({ kind: 'lesson-quiz', lesson: v.id, profile: v.profile });
  UI.startRun(v.profile, sess);
};
ACT.toChapter = function (el) {
  var ch = LM.chapterById(el.dataset.id);
  UI.go('subject', { profile: ch.profile, subject: ch.subject, focus: ch.id });
};

/* ---------- vue : résultats d'une série ---------- */
VIEWS.result = function (v) {
  var R = S.lastRun && S.lastRun.id === v.runner ? S.lastRun : UI.runners[v.runner];
  if (!R || !R.result) return { html: '<div class="card"><p>Résultat introuvable.</p></div>' };
  var pid = R.pid, kid = UI.kid(pid), r = R.result, band = LM.band(r.pct), spec = R.cfg.spec || {};
  var skillsArr = Object.keys(r.sk).map(function (k) { var a = r.sk[k]; return { id: k, pct: Math.round(100 * a[0] / a[1]), n: a[1] }; }).sort(function (a, b) { return a.pct - b.pct; });
  var weak = skillsArr.filter(function (s) { return s.pct < 70 && LM.SKILLS[s.id]; });
  var msg = kid ? ({ ok: 'Bravo, tu as très bien travaillé !', mid: 'Tu y es presque. Continue !', low: 'Ce n’est pas grave : on va revoir ça ensemble.' })[band.k]
    : ({ ok: 'Très bon travail. Les notions de cette série sont bien comprises.', mid: 'Presque : quelques points à consolider.', low: 'Cette partie demande encore du travail, et c’est normal : voici comment s’y prendre.' })[band.k];
  var recs = weak.length ? '<section class="card"><h2 class="h2">' + (kid ? 'Je peux revoir' : 'À revoir en priorité') + '</h2><ul class="recs">' + weak.map(function (s) {
    var S2 = LM.SKILLS[s.id];
    return '<li><div><strong>' + esc(S2.label) + '</strong><span class="muted"> · ' + s.pct + ' % sur ' + s.n + ' question' + (s.n > 1 ? 's' : '') + '</span></div><div class="row">' + S2.lessons.slice(0, 2).map(function (id) { return '<button class="btn sm" data-a="openLesson" data-id="' + id + '">' + icon('book') + esc(LM.LESSONS[id].title) + '</button>'; }).join('') + '<button class="btn sm soft" data-a="reviseSkill" data-s="' + s.id + '">' + icon('refresh') + 'S’entraîner</button></div></li>';
  }).join('') + '</ul></section>' : '<section class="card soft"><p>' + icon('check') + ' ' + (kid ? 'Rien d’important à revoir pour l’instant.' : 'Aucune compétence en dessous de 70 % dans cette série.') + '</p></section>';
  var skillsHTML = skillsArr.length ? '<section class="card"><h2 class="h2">Compétences de cette série</h2><ul class="skbars">' + skillsArr.map(function (s) { return '<li><span class="skn">' + esc(LM.skillLabel(s.id)) + '</span>' + UI.progressBar(s.pct, 100, LM.skillLabel(s.id)) + '<span class="skp">' + s.pct + ' %</span></li>'; }).join('') + '</ul></section>' : '';
  var corr = R.qs.map(function (Q, i) {
    var st = R.st[i], okc = st.w >= 0.99 ? 'ok' : (st.w > 0 ? 'mid' : 'ko');
    var yours = UI.respText(Q, st.resp);
    var wr = '';
    if (Q.type === 'write') wr = '<div class="rubric"><p><strong>Grille</strong> (coche avec un adulte)</p>' + Q.rubric.map(function (c, k) { return '<label class="check"><input type="checkbox" data-c="rtick" data-q="' + i + '"' + ((st.resp && st.resp.ticks && st.resp.ticks[k]) ? ' checked' : '') + '> ' + c + '</label>'; }).join('') + '</div>';
    return '<li class="corr ' + okc + '"><div class="corrhead"><span class="cn">' + (i + 1) + '</span>' + (okc === 'ok' ? icon('check') : (okc === 'mid' ? icon('refresh') : icon('cross'))) + '<span class="sr">' + (okc === 'ok' ? 'Juste' : (okc === 'mid' ? 'En partie juste' : 'Faux')) + '</span><span class="cs">' + Math.round(st.w * 100) / 100 + ' / 1</span></div>' +
      (Q.passage ? '<details class="passage"><summary>' + esc(Q.passageTitle || 'Le texte') + '</summary><div class="ptxt">' + Q.passage + '</div></details>' : '') +
      '<div class="cq">' + Q.q + '</div>' + (Q.fig && Q.type !== 'numline' ? LM.fig(Q.fig) : '') + '<p><span class="lbl2">Ta réponse :</span> ' + yours + '</p>' + (st.revealed ? '<p class="muted">Tu as demandé la correction.</p>' : '') +
      '<p><span class="lbl2">Réponse attendue :</span> <span class="goodans">' + LM.answerHTML(Q) + '</span></p>' + (Q.why ? '<div class="whybody">' + Q.why + '</div>' : '') + wr + '</li>';
  }).join('');
  var retry = '<button class="btn" data-a="redo">' + icon('refresh') + 'Refaire une série</button>';
  var back = '<button class="btn primary" data-a="afterRun">' + (spec.lesson ? 'Retour à la leçon' : 'Retour') + '</button>';
  var html = '<div class="resulthead ' + band.k + '"><p class="rk">' + esc(R.title) + '</p><div class="score"><span class="sc-n">' + (Math.round(r.sc * 10) / 10) + '</span><span class="sc-d">/ ' + r.n + '</span></div><p class="band">' + band.label + ' · ' + r.pct + ' %</p><p>' + msg + '</p><p class="muted">' + (R.mode === 'eval' ? 'Évaluation d’entraînement' : 'Série d’entraînement') + ' · durée ' + UI.fmtSecs(r.secs) + '. Ce n’est pas un examen officiel.</p></div>' +
    '<div class="row noprint">' + back + retry + '</div>' + recs + skillsHTML + '<section class="card"><h2 class="h2">Correction détaillée</h2><ol class="corrlist">' + corr + '</ol></section><div class="row noprint">' + back + retry + '</div>';
  return { title: 'Résultat', html: html, mount: function () { UI.live('Résultat : ' + r.pct + ' pour cent.'); } };
};
CHG.rtick = function (el) {
  var R = S.lastRun, i = +el.dataset.q, Q = R.qs[i], st = R.st[i];
  var ticks = Array.prototype.map.call(el.closest('.rubric').querySelectorAll('input'), function (c) { return c.checked; });
  st.resp = Object.assign({}, st.resp, { ticks: ticks });
  var res = LM.check(Q, st.resp); st.w = res.score; st.res = res;
  var sc = 0, sk = {}; R.qs.forEach(function (q, k) { var w = R.st[k].w; sc += w; var s = sk[q.skill || 'autre'] = sk[q.skill || 'autre'] || [0, 0]; s[0] += w; s[1]++; });
  R.result.sc = Math.round(sc * 100) / 100; R.result.pct = Math.round(100 * sc / R.qs.length); R.result.sk = sk;
  UI.save(); UI.toast('Auto-évaluation enregistrée : ' + R.result.pct + ' %');
  var cs = el.closest('.corr').querySelector('.cs'); if (cs) cs.textContent = Math.round(res.score * 100) / 100 + ' / 1';
};
ACT.afterRun = function () {

function weeklyData(pid) {

  }

}
function chartSVG(data) {
  var W = 560, H = 210, ox = 36, oy = 170, mx = Math.max(10, Math.max.apply(null, data.map(function (d) { return d.n; }))), bw = (W - ox - 40) / data.length, body = '', i;
  mx = Math.ceil(mx / 10) * 10;
  for (i = 0; i <= 4; i++) { var y = oy - (oy - 20) * i / 4; body += '<line x1="' + ox + '" y1="' + y + '" x2="' + (W - 36) + '" y2="' + y + '" stroke="var(--fig-line)" stroke-width="1" opacity=".5"/><text x="' + (ox - 6) + '" y="' + (y + 4) + '" font-size="11" text-anchor="end" fill="var(--muted)">' + Math.round(mx * i / 4) + '</text><text x="' + (W - 30) + '" y="' + (y + 4) + '" font-size="11" fill="var(--muted)">' + (25 * i) + '%</text>'; }
  var pts = [];
  data.forEach(function (d, k) {
    var h = (oy - 20) * d.n / mx, x = ox + k * bw;
    body += '<rect x="' + (x + bw * 0.18) + '" y="' + (oy - h) + '" width="' + (bw * 0.64) + '" height="' + h + '" fill="var(--fig-a)" opacity=".85" rx="3"/>';
    body += '<text x="' + (x + bw / 2) + '" y="' + (oy + 16) + '" font-size="11" text-anchor="middle" fill="var(--muted)">' + d.start.getDate() + '/' + (d.start.getMonth() + 1) + '</text>';
    if (d.acc !== null) pts.push([x + bw / 2, oy - (oy - 20) * d.acc / 100, d.acc]);
  });
  if (pts.length) {
    body += '<polyline fill="none" stroke="var(--fig-b)" stroke-width="3" stroke-linejoin="round" points="' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') + '"/>';
    pts.forEach(function (p) { body += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" fill="var(--surface)" stroke="var(--fig-b)" stroke-width="2.5"/>'; });
  }
  body += '<text x="' + ox + '" y="12" font-size="12" fill="var(--fig-a)" font-weight="700">■ Réponses données (par semaine)</text><text x="' + (ox + 230) + '" y="12" font-size="12" fill="var(--fig-b)" font-weight="700">● Réussite moyenne</text>';

}

  var tabs = '<nav class="ptabs" aria-label="Sections de l’espace parent">' + PTABS.map(function (t) { return '<button class="ptab" data-a="ptab" data-t="' + t[0] + '" aria-current="' + (tab === t[0] ? 'page' : 'false') + '">' + icon(t[2]) + '<span>' + t[1] + '</span></button>'; }).join('') + '</nav>';
